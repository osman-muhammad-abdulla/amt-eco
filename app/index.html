function shiftMonth(cm,delta){let[y,m]=cm.split("-").map(Number);m+=delta;if(m<1){m=12;y--;}if(m>12){m=1;y++;}return `${y}-${String(m).padStart(2,"0")}`;}
function dayData(iso){
  const cls=S.active, list=ST().classes[cls];
  const topic=(ST().topics[cls]||{})[iso]||"";
  const att=list.map(s=>({name:s.name,status:(s.attendance||{})[iso]||null,note:(s.attNotes||{})[iso]||""})).filter(x=>x.status);
  const events=[]; list.forEach(s=>(s.events||[]).filter(e=>e.date===iso).forEach(e=>events.push({name:s.name,label:e.label,delta:e.delta,type:e.type,score:e.score,max:e.max,note:e.note})));
  return {topic,att,events};
}
function viewCalendar(){

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* لیستی وانە/بابەت بۆ پرسیاری قرعە (هاوبەش لەگەڵ پەنجەرەی قرعە) */
function callLessonOpts(){ const term=S.lessonTerm||"t1", n=S.callLesson||1; let opts="";
  for(let i=1;i<=lessonMax();i++){ const Li=(LSN()[term]||{})[i], tps=(Li&&Li.topics)||[];

    tps.forEach((tp,k)=>{ opts+=`<option value="${i}:${k}" ${(i===n&&S.callTopic===k)?"selected":""}>🧩 وانەی ${i} — ${esc(tp.t||("بابەتی "+(k+1)))}</option>`; }); }
  return opts; }
let gcPickIdx=null;
function pickGroupCall(){
  const g=ST().groups[S.active]; if(!g) return; const n=g.names.length; const today=todayISO();
  /* هەر گروپێک یەک جار تا هەموویان پرسیاریان لێ دەکرێت، پاشان خولێکی نوێ */
  g.asked=(g.asked&&g.asked.d===today)?g.asked:{d:today,l:[]}; if(g.asked.l.length>=n) g.asked.l=[];
  const pool=[...Array(n).keys()].filter(i=>!g.asked.l.includes(i)); const i=pool[Math.floor(Math.random()*pool.length)];
  gcPickIdx=i; callPick=null; ding();
  const members=(g.members[i]||[]).map(id=>{ const s=findStu(id); return s?esc(s.name):""; }).filter(Boolean).join(" · ");
  $("#gcOut").innerHTML=`<div style="font-family:'Rabar_013','Amiri',serif;font-size:24px;font-weight:700;color:var(--bronze);margin:10px 0 2px">👥 گروپی ${esc(g.names[i])}</div>
    <div class="hint" style="margin-bottom:8px">${members}</div>
    <div id="callQ" style="margin-bottom:10px"></div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px">وەڵامی گروپەکە دیاری بکە (بۆ هەموو ئەندامەکان تۆمار دەکرێت):</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-sm" style="background:var(--green);color:#fff;border-color:var(--green)" data-gmark="right">✓ راست (+٢)</button>
      <button class="btn btn-sm" style="background:var(--amber);color:#fff;border-color:var(--amber)" data-gmark="mid">◐ ناوەند (+١)</button>
      <button class="btn btn-sm" style="background:var(--red);color:#fff;border-color:var(--red)" data-gmark="wrong">✗ هەڵە (−١)</button></div>`;
  document.querySelectorAll("[data-gmark]").forEach(b=>b.onclick=()=>markGroupCall(b.dataset.gmark));
  genCallQuestion();
}
function markGroupCall(result){
  const g=ST().groups[S.active]; const i=gcPickIdx; if(!g||i==null) return;
  const m={right:[2,"راست"],mid:[1,"ناوەند"],wrong:[-1,"هەڵە"]}[result]; const nm=g.names[i], today=todayISO(); let n=0;
  (g.members[i]||[]).forEach(id=>{ const s=findStu(id); if(!s) return; s.events=s.events||[];
    s.events.push({date:today,type:"part",delta:m[0],label:"پرسیاری قرعەی گروپ ("+nm+"): "+m[1],via:"gcall"}); n++; });
  g.scores[i]+=m[0]; g.asked=(g.asked&&g.asked.d===today)?g.asked:{d:today,l:[]}; if(!g.asked.l.includes(i)) g.asked.l.push(i);
  if(callCurQ){ try{ qlogList().push({d:today,term:callCurQ.term,n:callCurQ.n,q:callCurQ.line,r:result,sid:"group:"+nm}); }catch(e){}
    if(result==="wrong"){ if(callQUsed[callCurQ.n]) callQUsed[callCurQ.n].delete(callCurQ.line); }
    else { const list=qdoneList(callCurQ.term,callCurQ.n); if(!list.includes(callCurQ.line)) list.push(callCurQ.line); }
    callCurQ=null; }
  gcPickIdx=null; save(); renderMain(); toast(`گروپی ${nm} — ${m[1]} (${m[0]>0?"+":"−"}${kuNum(Math.abs(m[0]))} بۆ ${kuNum(n)} قوتابی)`);
}
function genGroups(re){
  const n=parseInt(($("#gCount")&&$("#gCount").value) || (ST().groups[S.active]?ST().groups[S.active].names.length:3));
  const pool0=curList().filter(s=>{const st=(s.attendance||{})[todayISO()]; return st!=="absent" && st!=="out" && st!=="yard" && st!=="leave";});
  const pool=pool0.length?pool0:curList();
  const ids=shuffle(pool.map(s=>s.id));
  const members=Array.from({length:n},()=>[]);
  ids.forEach((id,i)=>members[i%n].push(id));
  const names=shuffle(GROUPNAMES).slice(0,n);
  ST().groups[S.active]={names,members,scores:Array(n).fill(0)};
  save(); renderMain(); toast(re?"گروپەکان تێکەڵ کرانەوە":"گروپەکان دروستکران");
}

let SP={on:false,slides:[],idx:0,timer:null,mats:[]};
function ytEmbed(url){
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/))([\w-]{6,})/);
  return m? ("https://www.youtube.com/embed/"+m[1]+"?rel=0") : null;
}
function spMediaHTML(matId){
  const m=SP.mats.find(x=>x.id===matId); if(!m) return "";
  if(m.kind==="img"&&m.data) return `<div class="sp-media"><img src="${m.data}"></div>`;
  if(m.kind==="file") return `<div class="sp-media" id="spFileMedia"><div style="font-size:15px;color:rgba(255,255,255,.6)">⏳ فایلەکە دەکرێتەوە…</div></div>`;
  const url=m.url||"";
  const yt=ytEmbed(url);
  if(yt) return `<div class="sp-media"><iframe src="${yt}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>`;
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return `<div class="sp-media"><video src="${esc(url)}" controls playsinline></video></div>`;
  if(url) return `<div class="sp-media" style="font-size:16px"><a href="${esc(url)}" target="_blank" style="color:#F0C75E">🔗 ${esc(m.label||url)}</a></div>`;
  return "";
}
async function spLoadFileMedia(matId){
  const m=SP.mats.find(x=>x.id===matId); if(!m||m.kind!=="file") return;
  const box=document.getElementById("spFileMedia"); if(!box) return;
  if(SP.blobUrl){ try{URL.revokeObjectURL(SP.blobUrl);}catch(_){ } SP.blobUrl=null; }
  if(!driveHandle){ box.innerHTML=`<div style="font-size:15px;color:#F0C75E">📁 فۆڵدەری Drive نەبەستراوەتەوە — لە ڕێکخستنەکان ببەستەوە</div>`; return; }
  try{
    if(!(await ensurePerm(driveHandle,false))) throw new Error("perm");
    const fh=await driveHandle.getFileHandle(m.file);
    const f=await fh.getFile();
    const url=URL.createObjectURL(f); SP.blobUrl=url;
    if(m.sub==="video"||/\.(mp4|webm|mov|m4v|mkv|avi|ogg)$/i.test(m.file)){
      box.innerHTML=`<video src="${url}" controls autoplay playsinline></video>`;
    }else if(m.sub==="img"){
      box.innerHTML=`<img src="${url}">`;
    }else{
      box.innerHTML=`<a href="${url}" target="_blank" style="color:#F0C75E;font-size:16px">📄 ${esc(m.label||m.file)}</a>`;
    }
  }catch(e){ box.innerHTML=`<div style="color:#ff9d9d;font-size:15px">فایلەکە نەدۆزرایەوە لە فۆڵدەرەکە</div>`; }
}

function slideMapPlan(slides,term,n){
  const seen=new Set();
  return slides.map(sl=>{
    const txt=" "+[sl.title,sl.body,sl.cap].filter(Boolean).join(" ")+" ";
    const out=[];
    PLACES.forEach(P=>{ if(seen.has(P.key)||!placeAllowed(P,term,n)) return; const m=txt.match(P.rx); if(m){ seen.add(P.key); out.push({P,at:m.index}); } });
    out.sort((a,b)=>a.at-b.at);
    return out.map(o=>o.P);
  });
}

function riverHL(G,line){

  s+=`<rect width="${W}" height="${H}" fill="#bcd8e8"/>`;
  s+=`<path d="${G.land.filter(bb).map(r=>path(r)+"Z").join("")}" fill="#f3ead6" stroke="#a9987a" stroke-width="${0.8*f}"/>`;
  s+=`<path d="${G.lakes.filter(bb).map(r=>path(r)+"Z").join("")}" fill="#bcd8e8" stroke="#8fb3c9" stroke-width="${0.6*f}"/>`;
  // وڵاتی هەڵبژێردراو
  list.forEach(P=>{ if(P.c) s+=`<path d="${mapCountry(G,P.c).map(r=>path(r)+"Z").join("")}" fill="rgba(198,40,40,.22)" stroke="#b3261e" stroke-width="${2.2*f}"/>`; });
  s+=`<path d="${G.countries.map(c=>c.p.filter(bb).map(r=>path(r)+"Z").join("")).join("")}" fill="none" stroke="#b09a78" stroke-width="${0.9*f}" stroke-dasharray="${5*f} ${4*f}"/>`;
  s+=`<path d="${G.rivers.filter(bb).map(r=>path(r)).join("")}" fill="none" stroke="#5b9bd5" stroke-width="${(span<8?1.8:1.2)*f}" stroke-linejoin="round"/>`;
  // ناوچە و هێڵی هەڵبژێردراو
  list.forEach(P=>{
    [P.a,P.a2].forEach(a=>{ if(a) s+=`<path d="${path(a,1)}Z" fill="rgba(198,40,40,.2)" stroke="#b3261e" stroke-width="${2.4*f}" stroke-dasharray="${8*f} ${5*f}"/>`; });
    if(P.l) P.l.forEach(line=>{ s+= P.mt
      ? `<path d="${path(line,1)}" fill="none" stroke="rgba(120,72,30,.45)" stroke-width="${22*f}" stroke-linecap="round" stroke-linejoin="round"/>`
      : riverHL(G,line).map(r=>`<path d="${path(r,r.ll)}" fill="none" stroke="#1565c0" stroke-width="${5*f}" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`).join(""); });
  });
  // ناوە ڕێنماییەکان
  const hp=list.filter(P=>P.p).map(P=>[X(P.p[1]),Y(P.p[0])]);
  const near=(x,y,d)=>hp.some(q=>Math.hypot(q[0]-x,q[1]-y)<d);
  const txt=(x,y,t,fs,fill,w,extra)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" fill="${fill}" font-weight="${w||400}" text-anchor="middle" direction="rtl" stroke="#fff" stroke-width="${fs/5}" paint-order="stroke" stroke-linejoin="round" ${extra||""}>${esc(t)}</text>`;
  const usedSea=new Set();
  MAP_REF.sea.forEach(([t,la,lo])=>{ if(usedSea.has(t)||!inView(la,lo)) return; usedSea.add(t); s+=`<text x="${X(lo).toFixed(1)}" y="${Y(la).toFixed(1)}" font-size="${15*f}" fill="#3f6f8f" font-style="italic" text-anchor="middle">${esc(t)}</text>`; });
  if(span>5) MAP_REF.country.forEach(([t,la,lo])=>{ if(inView(la,lo)&&!near(X(lo),Y(la),60*f)) s+=`<text x="${X(lo).toFixed(1)}" y="${Y(la).toFixed(1)}" font-size="${16*f}" fill="#9a8663" font-weight="700" letter-spacing="1" text-anchor="middle" opacity=".85">${esc(t)}</text>`; });
  if(span<14) MAP_REF.city.forEach(([t,la,lo])=>{ if(!inView(la,lo)||near(X(lo),Y(la),34*f)) return; const x=X(lo),y=Y(la); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${3*f}" fill="#555"/>`+txt(x,y-7*f,t,12.5*f,"#444"); });
  // ناوی ڕووبارەکان بۆ دیجلە و فورات
  list.forEach(P=>{ if(P.ln) P.ln.forEach(([t,q])=>{ if(inView(q[0],q[1])) s+=txt(X(q[1]),Y(q[0]),t,18*f,"#0d47a1",700); }); });
  // خاڵ و ناوی سەرەکی — سەرەتا هەموو خاڵەکان، پاشان ناوەکان بە خۆپاراستن لە یەکتر
  const boxes=[];
  const ov=(b)=>boxes.reduce((t,o)=>t+Math.max(0,Math.min(b[2],o[2])-Math.max(b[0],o[0]))*Math.max(0,Math.min(b[3],o[3])-Math.max(b[1],o[1])),0);
  list.forEach(P=>{ if(!P.p) return; const x=X(P.p[1]), y=Y(P.p[0]);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${15*f}" fill="none" stroke="#c62828" stroke-width="${2.5*f}" opacity=".45"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${7.5*f}" fill="#c62828" stroke="#fff" stroke-width="${2.5*f}"/>`;
    boxes.push([x-12*f,y-12*f,x+12*f,y+12*f]); });
  const order=list.filter(P=>!P.ln).sort((a,b)=>(b.p?1:0)-(a.p?1:0));
  order.forEach(P=>{
    let x,y,anch=false;
    if(P.p){ x=X(P.p[1]); y=Y(P.p[0]); anch=true; }
    else if(P.a){ x=P.a.reduce((a,q)=>a+X(q[1]),0)/P.a.length; y=P.a.reduce((a,q)=>a+Y(q[0]),0)/P.a.length; }
    else if(P.c){ const r=mapCountry(G,P.c).slice().sort((a,b)=>b.length-a.length)[0]||[]; x=r.reduce((a,q)=>a+X(q[0]),0)/(r.length||1); y=r.reduce((a,q)=>a+Y(q[1]),0)/(r.length||1); }
    else if(P.l){ const L=P.l[0]; const q=L[Math.floor(L.length/2)]; x=X(q[1]); y=Y(q[0]); }
    const dense=list.length>6, fs=(dense?16:list.length>4?21:24)*f; const sub=dense?"":(P.s||""); const w=Math.max(P.n.length,sub.length*0.72)*fs*0.5+8*f, h=(sub?fs*1.85:fs*1.12);
    const up=-(18*f)-(h-fs), dn=30*f, sd=w/2+18*f;
    const cands= anch? [[0,up],[0,dn],[sd,fs*0.35-h/2+fs*0.1],[-sd,fs*0.35-h/2+fs*0.1],[sd*0.8,up+6*f],[-sd*0.8,up+6*f],[sd*0.8,dn-4*f],[-sd*0.8,dn-4*f]]
                     : [[0,0],[0,-h],[0,h],[w*0.6,0],[-w*0.6,0]];
    let best=null,bs=1e18;
    for(const c of cands){ const cx=Math.min(W-w/2-4,Math.max(w/2+4,x+c[0])), cy=Math.min(H-h+fs-4,Math.max(fs+4,y+c[1]));
      const bx=[cx-w/2,cy-fs,cx+w/2,cy-fs+h]; const sc=ov(bx)+Math.hypot(cx-x-c[0],cy-y-c[1])*20;
      if(sc<bs){ bs=sc; best=[cx,cy,bx]; } if(sc===0) break; }
    const [cx,cy,bx]=best; boxes.push(bx);
    s+=txt(cx,cy,P.n,fs,"#7f1d1d",800);
    if(sub) s+=txt(cx,cy+fs*0.92,sub,fs*0.72,"#5d4037",600);

  // تیری باکوور
  s+=`<g transform="translate(${26*f},${30*f})"><path d="M0,${-16*f} L${7*f},${6*f} L0,${2*f} L${-7*f},${6*f}Z" fill="#5d4037"/><text y="${22*f}" font-size="${12*f}" fill="#5d4037" text-anchor="middle">باکوور</text></g>`;
  return s+"</svg>";
}

function spKeys(e){
  if(!SP.on) return;
  const k=e.key;

  if(k==="Escape"){ spClose(); return; }
  if(k==="F5"||(k==="F5"&&e.shiftKey)){ e.preventDefault(); return; }
  if(k==="b"||k==="B"||k==="."||k==="w"||k==="W"){ e.preventDefault(); spBlack(); return; }
  const next=["PageDown","ArrowDown","ArrowLeft"," ","Enter","n","N","MediaTrackNext"];

  if(next.includes(k)){ e.preventDefault(); if(SP.black){ spBlack(); return; } spGo(SP.idx+1); }

/* ===== ڕەوتی وانە (٣٥ خولەک) — خۆگونجێنەر بەپێی ژمارەی بابەتەکان ===== */
let FLOW={on:false,phases:[],idx:0,left:0,paused:false,timer:null};
function flowPhasePlan(topics,totalMin,meth){
  const n=Math.max(1,topics.length);
  // fixed: open 6%, review 11%, close 14% — flexible: hook/teach/comp adapt to topic count
  const flex = n===1? {hook:9,teach:37,comp:23} : n===2? {hook:7,teach:46,comp:16} : {hook:5,teach:52,comp:12};
  const raw=[
    {key:"open",  ic:"🚪", name:"دەستپێک و غیاب", p:6,
     tip:"بە وزە و ڕووخۆشی بچۆ ژوورەوە. غیابەکە خێرا لە ئەپەکەوە وەربگرە. قوتابییان فێر دەبن کە هیچ کاتێک بەفیڕۆ نادرێت."},
    {key:"review",ic:"🔗", name:"زنجیرەی وانەکان — وانەی ڕابردوو", p:11, act:"call",
     tip:"٢–٣ پرسیاری خێرا لەسەر وانەی پێشوو بە بازنەی قرعە 🎡. پاشان بە یەک ڕستە بیبەستەرەوە بە وانەی ئەمڕۆوە: «ئەوەی بینیمان بووە هۆی…»"},
    {key:"hook",  ic:"💡", name:"پرسیاری داهێنان", p:flex.hook,
     tip:"پرسیارێکی سەرنجڕاکێش لەسەر بابەتی ئەمڕۆ کە هێشتا نەیانخوێندووە — با گریمانە بکەن. مێشکیان ئامادە دەکات و کونجکاوی دروست دەکات."}
  ];
  topics.forEach((t,i)=>raw.push({key:"teach"+i, ic:"📖", name:"باسکردن: "+t, p:flex.teach/n,
     tip:"وەک چیرۆک بیگێڕەوە نەک زانیاری وشک. هەر ٤ خولەک جارێک بوەستە و پرسیارێکی ٣٠ چرکەیی بکە. وێنە و هێڵی کات پیشان بدە."}));
  raw.push({key:"comp", ic:"🏆", name:"پێشبڕکێ و چالاکی", p:flex.comp, act:"call",
     tip:"پۆلەکە بکە بە دوو تیم. بازنەی قرعە + هەڵبژاردن یان ڕاست و هەڵە بەکاربهێنە — دوگمەی «وەڵامە ڕاستەکە» و دەنگەکە بۆ ئەمە دروستکراوە!"});
  if(meth){ const c=raw[raw.length-1]; c.ic=meth.ic; c.name="چالاکی: "+meth.ku; c.act=null; c.tip=meth.hist+"  —  هەنگاوەکان: "+meth.steps.map((x,i)=>(i+1)+") "+x).join(" "); }
  raw.push({key:"close",ic:"🎬", name:"پوختە و بابەتی داهاتوو", p:14,
     tip:"با قوتابییان خۆیان ٣ خاڵی سەرەکی بڵێنەوە. تیزەرێک بۆ وانەی داهاتوو وەک فیلم بڵێ، و ئەرکی ماڵەوە ڕابگەیەنە."});
  // convert % → minutes (round, min 1), fix drift on the biggest teaching phase
  let phases=raw.map(r=>({...r, min:Math.max(1,Math.round(totalMin*r.p/100))}));
  let drift=totalMin - phases.reduce((s,x)=>s+x.min,0);
  if(drift!==0){
    const teachIdx=phases.map((x,i)=>[x,i]).filter(([x])=>x.key.startsWith("teach")).map(([,i])=>i);
    const allIdx=phases.map((_,i)=>i);
    let k=0;
    for(const pool of [teachIdx,allIdx]){
      while(drift!==0 && pool.length){
        const i=pool[k%pool.length];
        const step=drift>0?1:-1;
        if(phases[i].min+step>=1){ phases[i].min+=step; drift-=step; }
        k++; if(k>400) break;
      }
      if(drift===0) break;
      k=0;
    }
  }
  return phases;
}

let wheelRot=0;

function wheelNames(){ return curList().map(s=>s.name); }
function drawWheel(){
  const svg=$("#wheelSvg"); if(!svg) return;
  const names=wheelNames();
  wheelRot=0; svg.style.transition="none"; svg.style.transform="rotate(0deg)";
  if(!names.length){ svg.innerHTML=`<circle cx="130" cy="130" r="126" fill="#eee" stroke="#c9a227" stroke-width="4"/><text x="130" y="136" text-anchor="middle" font-size="14" fill="#888">هیچ قوتابیەک نییە</text>`; return; }
  const N=names.length, seg=360/N, R=126, cx=130, cy=130;
  const rad=a=>(a-90)*Math.PI/180; // 0° = top, clockwise
  let parts="";
  const fs = N<=10?13 : N<=16?11 : N<=24?9.5 : 8;
  const maxCh = N<=10?14 : N<=16?12 : 10;
  for(let i=0;i<N;i++){
    const a0=i*seg, a1=(i+1)*seg, am=a0+seg/2;
    const x0=cx+R*Math.cos(rad(a0)), y0=cy+R*Math.sin(rad(a0));
    const x1=cx+R*Math.cos(rad(a1)), y1=cy+R*Math.sin(rad(a1));

      : `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
    let nm=(names[i]||"").trim(); if(nm.length>maxCh) nm=nm.slice(0,maxCh-1)+"…";
    const tr=R*0.62, tx=cx+tr*Math.cos(rad(am)), ty=cy+tr*Math.sin(rad(am));
    parts+=`<text class="wheel-name" x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${(am+90).toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${esc(nm)}</text>`;
  }

  svg.innerHTML=parts;

function qKind(line){
  const p=splitQA(String(line||"")), q=(p.q||"").trim(), a=(p.a||"").trim();
  if(/^(ڕاست|راست) (یان|و) هەڵە|(^|\s)(ڕاستە|ڕاست|هەڵەیە|هەڵە)[.!؟]?$/.test(q)||/^(ڕاستە|هەڵەیە|ڕاست|هەڵە|✓|✗)([\s.،(]|$)/.test(a)) return "tf";
  if(/^هەڵبژاردن|(^|\n|\s)(a|b|c|d|أ|ب|ج|د)[).\-]\s/i.test(q)||/^[(]?(a|b|c|d|أ|ب|ج|د)[)]?([\s.،]|$)/i.test(a)) return "mc";
  const wk=wqKind(q); if(wk==="essay"||wk==="why"||wk==="diff"||wk==="list"||a.length>110) return "long";
  return "short"; }
function qKindOK(line,type){ type=type||S.callQType||""; if(!type||type==="any") return true; return qKind(line)===type; }
async function genCallQuestion(){
  const term=S.lessonTerm||"t1", n=S.callLesson||1;
  const L=LES(term,n);
  const tp=(S.callTopic>=0 && (L.topics||[])[S.callTopic]) ? L.topics[S.callTopic] : null;
  const content=tp
    ? (((L.title?L.title+" — ":"")+"بابەت: "+tp.t+(tp.n?(" — "+tp.n):"")).trim())
    : (((L.title||"")+(L.notes?(" — "+L.notes):"")+((L.topics&&L.topics.length)?(" — بابەتەکان: "+topicsBrief(L)):"")).trim());
  const tqAll=(L.questions||[]).map(q=>(q||"").trim()).filter(Boolean);
  const tqK=tqAll.filter(q=>qKindOK(q));   /* تەنها جۆری هەڵبژێردراو */
  const SC=slideScope(tqK,term,n); const tq=SC.lines;   /* تەنها لەو سلایدانەی تا ئێستا پیشان دراون */
  const area=$("#callQ"); if(!area) return;
  callCurQ=null;
  if(SC.scoped&&!tq.length){ const sq=slideQuestion(SC);
    if(sq){ callCurQ={term,n,line:sq.q}; showCallQ(sq.q,sq.a,"📽️ لە سلایدەکانی ١–"+kuNum(SC.idx+1)+" (پرسیاری مامۆستا بۆ ئەم بەشە نییە)","📽️"); return; } }
  if(tqAll.length && !tqK.length){ const ql=(CALLQ_TYPES[S.callQType||"short"]||{}).label||"";
    area.innerHTML=`<div style="color:var(--ink-soft);font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px">
      ⚠️ پرسیاری جۆری «${esc(ql)}» بۆ ئەم وانەیە نییە (${kuNum(tqAll.length)} پرسیاری جۆری تر هەیە). جۆرێکی تر هەڵبژێرە${content?"، یان پرسیارێکی AI بەم جۆرە دروست بکە":""}.
      ${content?`<div style="margin-top:8px"><button class="btn btn-gh btn-sm" id="callQAI">✨ پرسیاری AI</button></div>`:""}</div>`;
    const ab=$("#callQAI"); if(ab) ab.onclick=genCallAI; return; }
  const retired=new Set(qdoneList(term,n));
  const pool=tq.filter(q=>!retired.has(q));
  callQUsed[n]=callQUsed[n]||new Set();
  let unused=pool.filter(q=>!callQUsed[n].has(q));
  if(pool.length && !unused.length){ callQUsed[n]=new Set(); unused=pool.slice(); } // سووڕی نوێ بۆ ماوەکان
  const showTeacher=(line)=>{ callQUsed[n].add(line); callCurQ={term,n,line};
    const p=splitQA(line);
    showCallQ(p.q,p.a,"پرسیاری مامۆستا · ماوە: "+pool.length+" لە "+tq.length+(SC.scoped?" · 📽️ تا سلایدی "+kuNum(SC.idx+1):""),"✍️"); };
  // ١) هەمیشە یەکەم جار پرسیارەکانی مامۆستا
  if(unused.length){ showTeacher(unused[Math.floor(Math.random()*unused.length)]); return; }
  // ٢) هەموو پرسیارەکان خانەنشین کراون؟
  if(tq.length && !pool.length){
    area.innerHTML=`<div style="color:var(--ink-soft);font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px">
      ✅ هەموو ${tq.length} پرسیارەکەی ئەم وانەیە بە ڕاستی وەڵام دراونەتەوە!
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
        <button class="btn btn-gh btn-sm" id="callQReset">🔄 دەستپێکردنەوەی پرسیارەکان</button>
        ${content?`<button class="btn btn-gh btn-sm" id="callQAI">✨ پرسیاری AI</button>`:""}
      </div></div>`;
    const rb=$("#callQReset"); if(rb) rb.onclick=()=>{ const l=qdoneList(term,n); l.length=0; callQUsed[n]=new Set(); save(); genCallQuestion(); };
    const ab=$("#callQAI"); if(ab) ab.onclick=genCallAI;
    return;
  }
  // ٣) پرسیاری مامۆستا نییە → پرسیاری خۆکار لە پلانی وانە
  if(!tq.length){ const aq=autoQs(L).filter(q=>!callQUsed[n].has(q)&&qKindOK(q)); const pick=aq.length?aq[Math.floor(Math.random()*aq.length)]:null;
    if(pick){ callQUsed[n].add(pick); callCurQ={term,n,line:pick}; showCallQ(pick,"","پرسیاری پلانی وانە","❓"); return; } }
  if(!content){ area.innerHTML=`<div style="color:var(--ink-faint);font-size:12.5px">پرسیار دانەنراوە بۆ وانەی ${n} — لە «وانە و کەرەستە» پرسیارەکانت زیاد بکە.</div>`; return; }
  genCallAI();
}
/* پرسیاری خۆکار لە پلانی وانە کاتێک پرسیاری ئامادەکراو نییە — هەر جارێک تەنها یەک پرسیاری کورت */
function autoQs(L){
  const out=[]; const g=L.guide||{};
  Object.values(g).forEach(t=>{ (String(t).match(/«([^»]{6,140}؟)»/g)||[]).forEach(x=>out.push(x.slice(1,-1))); });
  (L.topics||[]).forEach(tp=>{ if(tp.t) out.push("باسی «"+tp.t+"» بکە."); });
  if(!out.length && L.title) out.push("چی دەزانیت دەربارەی «"+L.title+"»؟");
  return [...new Set(out)];
}
async function genCallAI(){
  const term=S.lessonTerm||"t1", n=S.callLesson||1;
  const L=LES(term,n);
  const tp=(S.callTopic>=0 && (L.topics||[])[S.callTopic]) ? L.topics[S.callTopic] : null;
  const content=tp
    ? (((L.title?L.title+" — ":"")+"بابەت: "+tp.t+(tp.n?(" — "+tp.n):"")).trim())
    : (((L.title||"")+(L.notes?(" — "+L.notes):"")+((L.topics&&L.topics.length)?(" — بابەتەکان: "+topicsBrief(L)):"")).trim());
  const area=$("#callQ"); if(!area) return;
  callCurQ=null;
  area.innerHTML=`<div style="color:var(--ink-faint);font-size:13px;padding:6px">⏳ پرسیار دروست دەکرێت…</div>`;
  const qt=CALLQ_TYPES[S.callQType||"short"]||CALLQ_TYPES.short;
  const hist=(callQHist[n]||[]).slice(-6);
  const avoid=hist.length?("\n\nئەم پرسیارانە دووبارە مەکەرەوە، جیاواز بێت:\n- "+hist.join("\n- ")):"";
  const sys='تۆ مامۆستایەکی '+SUBJ().name+'ی قۆناغی ئامادەیی لە کوردستانیت. بە کوردیی سۆرانی پرسیار دروست دەکەیت. وەڵامەکەت دەبێت تەنها JSON بێت بەم شێوەیە بەبێ هیچ دەقێکی تر و بەبێ backtick: {"q":"دەقی پرسیارەکە","a":"وەڵامە ڕاستەکە"}';
  const prompt=`لەسەر ئەم وانەیەی ${SUBJ().name}ی پۆلی ${S.stage}، تەنها یەک پرسیار دروست بکە بەم جۆرە: ${qt.inst}${avoid}\n\nوانە: ${content}\n\nتەنها JSON بگەڕێنەرەوە.`;
  try{
    const raw=await callClaude([{role:"user",content:prompt}],sys,600);
    let q="",a="";
    try{
      const j=JSON.parse(raw.replace(/```json|```/g,"").trim());
      q=(j.q||"").trim(); a=(j.a||"").trim();
    }catch(_){ q=raw.trim(); a=""; }
    if(!q) throw new Error("empty");
    callQHist[n]=(callQHist[n]||[]).concat(q);
    showCallQ(q,a,"پرسیاری AI — "+qt.label,"❓");
  }catch(e){
    const aq=autoQs(L); if(aq.length){ const q=aq[Math.floor(Math.random()*aq.length)]; callCurQ={term,n,line:q}; showCallQ(q,"","پرسیاری پلانی وانە","❓"); } else { const a2=$("#callQ"); if(a2) a2.innerHTML=`<div class="callq-box">✋ پرسیارێک بکە لەسەر: ${esc(L.title||("وانەی "+n))}</div>`; }
  }
}
function ding(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C(); const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type="triangle"; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.4);
    o.start(); o.stop(ctx.currentTime+0.42);
  }catch(e){}
}
function fanfare(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C();
    const notes=[[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.38]];
    notes.forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.16,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.32);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.35);
    });
  }catch(e){}
}
function markCall(result){
  if(!callPick) return;
  const map={right:[2,"راست"],mid:[1,"ناوەند"],wrong:[-1,"هەڵە"]};
  const m=map[result]; const s=callPick;
  s.events=s.events||[]; s.events.push({date:todayISO(),type:"part",delta:m[0],label:"پرسیاری قرعە: "+m[1],via:"call"});
  s.calls=s.calls||[]; s.calls.push(todayISO());
  // چارەنووسی پرسیارەکە: ڕاست/ناوەند → خانەنشین (دووبارە نابێتەوە)؛ هەڵە → دەگەڕێتەوە ناو قرعەکە
  if(callCurQ){
    try{ qlogList().push({d:todayISO(),term:callCurQ.term,n:callCurQ.n,q:callCurQ.line,r:result,sid:s.id}); }catch(e){}
    if(result==="wrong"){
      if(callQUsed[callCurQ.n]) callQUsed[callCurQ.n].delete(callCurQ.line);
    }else{
      const list=qdoneList(callCurQ.term,callCurQ.n);
      if(!list.includes(callCurQ.line)) list.push(callCurQ.line);
    }
    callCurQ=null;
  }
  save(); toast(s.name+" — "+m[1]);
  if(LIVE.myCall){ liveSend({call:null,marked:{id:LIVE.myCall,r:result,dev:devId(),name:s.name}}); LIVE.markSeen=LIVE.myCall; LIVE.myCall=null; }
  callPick=null;
  openCall();
}

  const src=document.querySelector(sel); if(!src) return "";
  const cl=src.cloneNode(true);
  const srcIn=src.querySelectorAll("input,select"), clIn=cl.querySelectorAll("input,select");
  clIn.forEach((el,i)=>{ const sp=document.createElement("span"); const o=srcIn[i];

  cl.removeAttribute("id");

}

async function qgenGenerate(){
  const term=$("#qTerm").value, from=parseInt($("#qFrom").value), to=parseInt($("#qTo").value);
  const count=Math.max(1,parseInt(normDigits($("#qCount").value))||10), marks=Math.max(1,parseInt(normDigits($("#qMarks").value))||20);
  const typeLabel=$("#qType").value;
  const content=$("#qContent").value.trim();
  if(!content){ toast("ناوەڕۆک بنووسە یان وانە هەڵبژێرە کە تێبینی هەبێت"); return; }
  const dist=readDistRows();
  qgBusy(true,"پرسیارەکان دروست دەکرێن…");
  const sys="تۆ مامۆستایەکی شارەزای "+SUBJ().name+"ی قۆناغی ئامادەیی لە هەرێمی کوردستانی عێراقیت. هەمیشە بە زمانی کوردیی سۆرانی وەڵام دەدەیتەوە.";
  let typePart;
  if(dist.length){
    const total=dist.reduce((s,r)=>s+r.count,0);
    typePart=`${total} پرسیار دروست بکە، بەم شێوەیە بەش بەش (هەر بەشێک بە پ١، پ٢، پ٣… ژمارە بکە):\n`+
      dist.map((r,i)=>`پ${i+1}: ${r.count} پرسیاری «${r.type}»`).join("\n");
  }else{
    typePart=`${count} پرسیار دروست بکە بە جۆری «${typeLabel}»`;
  }
  const prompt=`لەسەر ئەم ناوەڕۆکەی ${SUBJ().name}ی پۆلی ${S.stage} (وانەی ${Math.min(from,to)} تا ${Math.max(from,to)})، ${typePart}.\n\nمەرجەکان:\n- پرسیارەکان بە شێوەیەکی یەکسان بەسەر هەموو وانەکانی ناو مەوداکەدا دابەش بکە، نەک تەنها لە یەک-دوو وانە.\n- کۆی نمرە دەبێت ${marks} نمرە بێت — نمرەی هەر بەشێک/پرسیارێک لەتەنیشتی بنووسە بەشێوەیەک کۆیان ببێتە ${marks}.\n- بەبێ وەڵام، تەنها پرسیارەکان.\n- بە شێوەی وەرەقەی تاقیکردنەوەی ڕێکوپێک و ئامادە بۆ چاپ بنووسە.\n\nناوەڕۆک:\n${content}`;
  try{
    const txt=await callClaude([{role:"user",content:prompt}],sys,4000);
    qgState.lastQ=txt; qgState.out=txt;
    showQOut(txt);
    const a=$("#qAns"); if(a) a.style.display="";
    const f=$("#qFix"); if(f) f.style.display="";
  }catch(e){ qgenError(e); }
  qgBusy(false);
}

function qgenError(e){
  const hasKey=!!(S.apiKey||"").trim();
  const msg = hasKey
    ? "نەتوانرا پەیوەندی بە Claude بکرێت. دڵنیابە لە ئینتەرنێت و کلیلی API لە ڕێکخستن."
    : "ئەم تایبەتمەندییە لەناو claude.ai کاردەکات. لە وەشانی داگیراو/هۆستکراو، کلیلی API لە ڕێکخستن دابنێ.";
  $("#qOut").innerHTML=`<div style="background:var(--red-soft);color:var(--red);border-radius:10px;padding:12px;font-size:13px">${msg}<div style="color:var(--ink-faint);margin-top:6px;font-size:11.5px">${esc(String(e&&e.message||e).slice(0,160))}</div></div>`;

async function callClaude(messages,system,maxTokens){
  const key=(S.apiKey||"").trim();
  const headers={"Content-Type":"application/json"};
  const body={ model:"claude-sonnet-4-6", max_tokens:maxTokens||2000, messages };
  if(system) body.system=system;
  if(key){ headers["x-api-key"]=key; headers["anthropic-version"]="2023-06-01"; headers["anthropic-dangerous-direct-browser-access"]="true"; }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers,body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("HTTP "+res.status+" "+t.slice(0,140)); }
  const data=await res.json();
  return (data.content||[]).map(b=>b.type==="text"?b.text:"").join("\n").trim();
}

function labelFor(type,d){
  if(type==="quiz") return d>0?"کویزی باش":"کویزی لاواز";

}
function addQuiz(id){

/* ===== ناوەکان: یەکخستن (merge) — نە دووبارە، نە سڕینەوەی مێژوو ===== */
function normName(n){ let t=String(n||""); try{ t=fixKurdishText(t); }catch(e){}
  t=t.replace(/ه[‌‍]/g,"ە").replace(/[ً-ٰٟـ‌‍‎‏]/g,"")
     .replace(/ي|ى/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ە").replace(/[إأآٱ]/g,"ا").replace(/ؤ/g,"ۆ")
     .replace(/ه(?=\s|$)/g,"ە").replace(/^[\s0-9٠-٩\.\-_،,؛()]+/,"").replace(/[\s\.،,؛]+$/,"").replace(/\s+/g," ").trim();
  return t; }
/* ڕیزی ناونیشان یان سەردێڕ — وەک قوتابی زیاد ناکرێت */
function isTitleRow(n){ const t=normName(n); if(!t) return true;
  if(/^(ناو|ناوی قوتابی|ناوی قوتابیان|ناوی سیانی|ناوی چواری|ناوی سیانیی قوتابی|ژ|ژمارە|ز|ت|م|ڕیز|زنجیرە|تێبینی)$/.test(t)) return true;
  return /(^|\s)(پۆلی|پۆل|بەشی|قوتابخانە|ئامادەیی|ناوەندی|وێژەیی|زانستی|ساڵی خوێندن|لیستی)(\s|$)/.test(t); }
function mergeStudentInto(a,b){
  a.attendance=a.attendance||{}; Object.entries(b.attendance||{}).forEach(([d,v])=>{ if(!a.attendance[d]) a.attendance[d]=v; });
  const seen=new Set((a.events||[]).map(e=>e.k||JSON.stringify(e))); a.events=a.events||[];
  (b.events||[]).forEach(e=>{ const k=e.k||JSON.stringify(e); if(!seen.has(k)){ seen.add(k); a.events.push(e); } });
  a.marks=a.marks||{}; Object.entries(b.marks||{}).forEach(([t,m])=>{ const am=a.marks[t]=a.marks[t]||{}; Object.entries(m||{}).forEach(([k,v])=>{ if((am[k]==null||am[k]==="")&&v!=null&&v!=="") am[k]=v; }); });
  if(b.attNotes){ a.attNotes=a.attNotes||{}; Object.entries(b.attNotes).forEach(([d,v])=>{ if(!a.attNotes[d]) a.attNotes[d]=v; }); }
  if((!a.level||a.level==="n")&&b.level&&b.level!=="n") a.level=b.level;
  Object.keys(b).forEach(k=>{ if(!(k in a)||a[k]==null||a[k]==="") a[k]=b[k]; });
}
function dedupeSection(sec){
  const st=ST(); sec=sec||S.active; const list=st.classes[sec]||[]; const by=new Map(); const keep=[]; let merged=0;
  list.forEach(s=>{ const k=normName(s.name);
    if(isTitleRow(s.name)&&!Object.keys(s.attendance||{}).length&&!(s.events||[]).length){ st.removed=st.removed||{}; (st.removed[sec]=st.removed[sec]||[]).push(Object.assign({},s,{removedAt:todayISO()})); merged++; const g=st.groups&&st.groups[sec]; if(g&&g.members) g.members=g.members.map(m=>m.filter(id=>id!==s.id)); return; }
    if(!k){ keep.push(s); return; } const a=by.get(k);
    if(a){ mergeStudentInto(a,s); merged++;
      const g=st.groups&&st.groups[sec]; if(g&&g.members) g.members=g.members.map(m=>[...new Set(m.map(id=>id===s.id?a.id:id))]);
    } else { by.set(k,s); keep.push(s); } });
  if(merged||keep.length!==list.length){ st.classes[sec]=keep; const g=st.groups&&st.groups[sec]; if(g&&g.members){ const all=new Set(); g.members=g.members.map(m=>m.filter(id=>!all.has(id)&&all.add(id))); } }
  return merged;
}
function dupCount(sec){ const list=ST().classes[sec||S.active]||[]; const ok=list.filter(s=>!(isTitleRow(s.name)&&!Object.keys(s.attendance||{}).length&&!(s.events||[]).length)); const n=new Set(ok.map(s=>normName(s.name))); return list.length-n.size; }
function mergeNames(names){
  const st=ST(); const sec=S.active; const merged=dedupeSection(sec); const list=st.classes[sec]=st.classes[sec]||[];
  const have=new Set(list.map(s=>normName(s.name))); let added=0, kept=0; const newIds=[];

/* --- گەڕاندنەوەی مێژوو لە ئەرشیفەوە بۆ هەمان قوتابی (بە ناوی ڕێکخراو) --- */
function reviveFromArchive(st,sec){
  const arch=((st.removed||{})[sec]||[]); const list=(st.classes||{})[sec]||[]; if(!arch.length||!list.length) return 0;
  const byK=new Map(list.map(s=>[normName(s.name),s])); const keep=[]; let n=0;
  const hist=s=>Object.keys(s.attendance||{}).length+(s.events||[]).length;
  arch.forEach(o=>{ const cur=byK.get(normName(o.name));
    if(cur){ if(hist(o)){ const c=Object.assign({},o); delete c.removedAt; delete c.id; delete c.name; mergeStudentInto(cur,c); n++; } }   // ناوی هاوشێوە: مێژوو دەگەڕێتەوە، تۆماری بەتاڵ فڕێ دەدرێت
    else if(hist(o)) keep.push(o); });   // تۆماری بەتاڵی ئەرشیف (بێ مێژوو) فڕێ دەدرێت
  const changed=keep.length!==arch.length; st.removed[sec]=keep; if(changed&&!n&&st.lastImport&&!keep.length) delete st.lastImport[sec];
  if(n&&st.lastImport) delete st.lastImport[sec];
  return n;
}
function reviveAll(){ let n=0; Object.values(S.stages||{}).forEach(st=>{ if(!st||!st.removed) return; Object.keys(st.removed).forEach(sec=>{ n+=reviveFromArchive(st,sec); }); }); return n; }

/* ---- Excel / CSV name import (dependency-free) ---- */
const NAME_HEADERS=["ناو","ناوی","ناوی قوتابی","ناوى چوارى","ناوی چواری","ناوى قوتابی","قوتابی","name","fullname","full name","زنجیرە","سیریال","ژ.تۆماری گشتی","ژمارە","ژ"];
const isNum=t=>/^-?\d+(\.\d+)?$/.test(String(t).trim());
function isHeaderish(t){ const x=String(t).trim().toLowerCase(); return NAME_HEADERS.some(h=>x===h.toLowerCase()); }
async function inflateRaw(bytes){
  const ds=new DecompressionStream("deflate-raw");
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function zipEntries(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let eocd=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-22-65557;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error("bad zip");
  const cdCount=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true);
  const e={};
  for(let k=0;k<cdCount;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const fnLen=dv.getUint16(off+28,true), exLen=dv.getUint16(off+30,true), cmLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.subarray(off+46,off+46+fnLen));
    e[name]={method,compSize,localOff}; off+=46+fnLen+exLen+cmLen;
  }
  return {u8,dv,e};
}
async function zipRead(z,name){
  const it=z.e[name]; if(!it) return null;
  const lfn=z.dv.getUint16(it.localOff+26,true), lex=z.dv.getUint16(it.localOff+28,true);
  const start=it.localOff+30+lfn+lex;
  const comp=z.u8.subarray(start,start+it.compSize);
  const raw= it.method===0 ? comp : await inflateRaw(comp);
  return new TextDecoder("utf-8").decode(raw);
}

/* --- Excel: لیستی شیتەکان و هەڵبژاردنی شیتی بەشەکە --- */
async function xlsxSheets(z){
  const wb=await zipRead(z,"xl/workbook.xml"); const rl=await zipRead(z,"xl/_rels/workbook.xml.rels"); if(!wb||!rl) return [];
  const rels={}; [...rl.matchAll(/<Relationship\b[^>]*>/g)].forEach(m=>{ const id=(m[0].match(/Id="([^"]+)"/)||[])[1], t=(m[0].match(/Target="([^"]+)"/)||[])[1]; if(id&&t) rels[id]=t; });
  return [...wb.matchAll(/<sheet\b[^>]*>/g)].map(m=>{ const name=(m[0].match(/name="([^"]*)"/)||[])[1]||""; const rid=(m[0].match(/r:id="([^"]+)"/)||[])[1]; let t=rels[rid]||""; t=t.replace(/^\/?xl\//,""); return {name:name.replace(/&amp;/g,"&"),path:"xl/"+t}; }).filter(x=>x.path!=="xl/");
}
function secAliases(sec){ const m={A:["a","أ","ا","ئەی","ئێ","یەکەم","1"],B:["b","ب","بی","دووەم","2"],C:["c","ج","سی","سێیەم","3"],D:["d","د","دی","چوارەم","4"],E:["e","هـ","ه","پێنجەم","5"]}; return (m[sec]||[sec.toLowerCase()]); }
function pickSheetForSection(sh,sec){ const al=secAliases(sec);
  return sh.find(x=>{ const n=normName(x.name).toLowerCase(); const toks=n.split(/[\s\-_()\/]+/).filter(Boolean); return toks.some(t=>al.includes(t)) || al.some(a=>a.length>1&&n.includes(a)); })||null; }
function chooseSheet(sh){ return new Promise(res=>{
  $("#modal").innerHTML=`<div class="m-head"><button class="close" id="mClose">×</button><div class="m-name">📑 کام شیت هی بەشی ${esc(S.active)} ـە؟</div><div class="m-meta">فایلەکە ${kuNum(sh.length)} شیتی تێدایە</div></div>
   <div class="m-body"><div style="display:flex;flex-direction:column;gap:8px">${sh.map((x,i)=>`<button class="btn btn-gh" data-shi="${i}">${esc(x.name||("شیت "+(i+1)))}</button>`).join("")}</div></div>
   <div class="m-foot"><button class="btn btn-gh btn-sm" id="mClose2">پاشگەزبوونەوە</button></div>`;
  $("#overlay").classList.add("show"); const no=()=>{ closeStudent(); res(null); }; $("#mClose").onclick=$("#mClose2").onclick=no;
  document.querySelectorAll("[data-shi]").forEach(b=>b.onclick=()=>{ closeStudent(); res(sh[+b.dataset.shi]); }); }); }

async function parseXlsxNames(file){
  const u8=new Uint8Array(await file.arrayBuffer());
  const z=zipEntries(u8);
  const ssXml=await zipRead(z,"xl/sharedStrings.xml");
  const shared = ssXml ? [...new DOMParser().parseFromString(ssXml,"application/xml").getElementsByTagName("si")]
      .map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join("")) : [];
  let sheetPath="xl/worksheets/sheet1.xml";
  if(!z.e[sheetPath]){ const k=Object.keys(z.e).find(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)); if(k) sheetPath=k; }
  try{ const sh=await xlsxSheets(z); if(sh.length>1){ const pick=pickSheetForSection(sh,S.active); if(pick) sheetPath=pick.path; else { const ch=await chooseSheet(sh); if(!ch) return null; sheetPath=ch.path; } } }catch(e){ console.warn("sheets",e); }
  const shXml=await zipRead(z,sheetPath);
  const doc=new DOMParser().parseFromString(shXml,"application/xml");
  const cols={};
  [...doc.getElementsByTagName("c")].forEach(c=>{
    const ref=c.getAttribute("r")||""; const col=ref.replace(/[0-9]/g,"");
    const t=c.getAttribute("t"); let val=null;
    if(t==="s"){ const v=c.getElementsByTagName("v")[0]; if(v) val=shared[parseInt(v.textContent)]; }
    else if(t==="inlineStr"){ const ts=c.getElementsByTagName("t")[0]; if(ts) val=ts.textContent; }
    else { const v=c.getElementsByTagName("v")[0]; if(v) val=v.textContent; }
    if(val!=null && String(val).trim()!==""){ (cols[col]=cols[col]||[]).push(String(val).trim()); }
  });
  let best=null,bestN=-1;
  for(const col in cols){ const n=cols[col].filter(t=>!isNum(t)&&!isHeaderish(t)&&t.length>1).length; if(n>bestN){bestN=n;best=col;} }
  if(!best) return [];
  return cols[best].filter(t=>!isNum(t)&&!isHeaderish(t)&&t.length>1);
}
async function parseCsvNames(file){
  const txt=await file.text();
  const rows=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/[,;\t]/).map(c=>c.replace(/^"|"$/g,"").trim()));
  const maxC=Math.max(...rows.map(r=>r.length));
  let best=0,bestN=-1;
  for(let c=0;c<maxC;c++){ const n=rows.filter(r=>r[c]&&!isNum(r[c])&&!isHeaderish(r[c])&&r[c].length>1).length; if(n>bestN){bestN=n;best=c;} }
  return rows.map(r=>r[best]).filter(t=>t&&!isNum(t)&&!isHeaderish(t)&&t.length>1);
}
function autoGroups(n){
  const ids=shuffle(curList().map(s=>s.id));
  if(!ids.length) return;
  const members=Array.from({length:n},()=>[]);
  ids.forEach((id,i)=>members[i%n].push(id));
  ST().groups[S.active]={names:shuffle(GROUPNAMES).slice(0,n),members,scores:Array(n).fill(0)};
}

/* ===== ⇅ گواستنەوەی داتا (amj-transfer v1) — هەموو localStorage + هەموو IndexedDB، بە Blob و ArrayBuffer ===== */
const XF_SECRET_KEYS=["apiKey","sync","secret","token","password","key"];   /* هیچ کلیل یان وشەی نهێنی ناچێتە ناو فایل */
function xfB64FromBuf(buf){ const u=new Uint8Array(buf); let s=""; const CH=0x8000; for(let i=0;i<u.length;i+=CH) s+=String.fromCharCode.apply(null,u.subarray(i,i+CH)); return btoa(s); }

async function xfEnc(v,st){
  if(v==null||typeof v!=="object") return v;
  if(typeof Blob!=="undefined"&&v instanceof Blob){ st.files++; const b=await v.arrayBuffer(); return {__blob:1,type:v.type||"",name:v.name||"",b64:xfB64FromBuf(b)}; }
  if(v instanceof ArrayBuffer){ st.files++; return {__buf:1,b64:xfB64FromBuf(v)}; }
  if(ArrayBuffer.isView(v)){ st.files++; return {__buf:1,b64:xfB64FromBuf(v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength))}; }
  if(typeof FileSystemHandle!=="undefined"&&v instanceof FileSystemHandle) return null;   /* دەسەڵاتی فۆڵدەری ئامێر ناگوازرێتەوە */
  if(v instanceof Date) return v.toISOString();
  if(Array.isArray(v)){ const o=[]; for(const x of v) o.push(await xfEnc(x,st)); return o; }
  const o={}; for(const k of Object.keys(v)) o[k]=await xfEnc(v[k],st); return o;
}
function xfDec(v,st){
  if(v==null||typeof v!=="object") return v;
  if(v.__blob===1){ st.files++; const buf=xfBufFromB64(v.b64); try{ return v.name?new File([buf],v.name,{type:v.type||""}):new Blob([buf],{type:v.type||""}); }catch(e){ return new Blob([buf],{type:v.type||""}); } }
  if(v.__buf===1){ st.files++; return xfBufFromB64(v.b64); }
  if(Array.isArray(v)) return v.map(x=>xfDec(x,st));
  const o={}; for(const k of Object.keys(v)) o[k]=xfDec(v[k],st); return o;
}
function xfScrubState(raw){ try{ const o=JSON.parse(raw); XF_SECRET_KEYS.forEach(k=>delete o[k]); return JSON.stringify(o); }catch(e){ return raw; } }
function xfIdbOpen(name,version){ return new Promise((res,rej)=>{ const r=version?indexedDB.open(name,version):indexedDB.open(name); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error("blocked")); }); }
async function xfIdbList(){ if(indexedDB.databases){ try{ return (await indexedDB.databases()).filter(d=>d&&d.name); }catch(e){} } return [{name:"hm-fs"}]; }
function xfCounts(state,ls,idbRec,files){
  const c={students:0,classes:0,days:0,attendance:0,grades:0,plans:0,notes:0,files:files||0,localStorage:ls,idbRecords:idbRec};
  const days=new Set();
  Object.values((state&&state.stages)||{}).forEach(st=>{ if(!st||!st.classes) return;
    Object.values(st.classes).forEach(list=>{ if(!Array.isArray(list)||!list.length) return; c.classes++; c.students+=list.length;
      list.forEach(s=>{ Object.keys(s.attendance||{}).forEach(d=>{ days.add(d); c.attendance++; });
        Object.values(s.marks||{}).forEach(m=>Object.values(m||{}).forEach(v=>{ if(v!=null&&v!=="") c.grades++; }));
        (s.events||[]).forEach(e=>{ if(e.type==="quizscore") c.grades++; if(e.type==="note"&&e.note) c.notes++; });
        if(s.photo) c.files++; }); });
    ["lessons"].forEach(k=>Object.values((st[k])||{}).forEach(t=>{ c.plans+=Object.keys(t||{}).length; }));
    Object.values(((st.hr||{}).lessons)||{}).forEach(t=>{ c.plans+=Object.keys(t||{}).length; }); });
  c.days=days.size; return c; }
async function buildTransfer(){
  const st={files:0}; const ls={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); let v=localStorage.getItem(k); if(k===KEY) v=xfScrubState(v); ls[k]=v; }
  if(!(KEY in ls)){ const v=await store.get(KEY); if(v) ls[KEY]=xfScrubState(v); }
  const dbs=[]; let rec=0;
  for(const d of await xfIdbList()){
    let db; try{ db=await xfIdbOpen(d.name); }catch(e){ continue; }
    const out={name:d.name,version:db.version,stores:[]};
    for(const sn of Array.from(db.objectStoreNames)){
      const tx=db.transaction(sn,"readonly"), os=tx.objectStore(sn);
      const rows=await new Promise((res)=>{ const R=[]; const cur=os.openCursor(); cur.onsuccess=()=>{ const c=cur.result; if(!c) return res(R); R.push([c.key,c.value]); c.continue(); }; cur.onerror=()=>res(R); });
      const enc=[]; for(const [k,v] of rows){ if(k==="handle"||(typeof k==="string"&&k.indexOf("ls:")===0)) continue; enc.push([k,await xfEnc(v,st)]); }
      rec+=enc.length; out.stores.push({name:sn,keyPath:os.keyPath==null?null:os.keyPath,autoIncrement:!!os.autoIncrement,rows:enc}); }
    db.close(); dbs.push(out); }
  return {format:"amj-transfer",version:1,app:"HSH",appVersion:1,exportedAt:new Date().toISOString(),origin:location.origin,
    counts:xfCounts(S,Object.keys(ls).length,rec,st.files),localStorage:ls,indexedDB:dbs};
}

const XF_LBL={students:"قوتابی",classes:"پۆل/بەش",days:"ڕۆژی غیاب",attendance:"تۆماری غیاب",grades:"نمرە",plans:"پلان/وانە",notes:"سەرنج",files:"فایل/وێنە",localStorage:"کلیلی localStorage",idbRecords:"تۆماری IndexedDB"};

async function xfRestoreIdb(dbs,st){
  let rec=0;
  for(const d of dbs||[]){
    let db; try{ db=await xfIdbOpen(d.name); }catch(e){ db=null; }
    const need=(d.stores||[]).filter(s=>!db||!db.objectStoreNames.contains(s.name));
    if(need.length){ const v=Math.max(db?db.version+1:1,d.version||1); if(db) db.close();
      db=await new Promise((res,rej)=>{ const r=indexedDB.open(d.name,v); r.onupgradeneeded=()=>{ need.forEach(s=>{ if(!r.result.objectStoreNames.contains(s.name)) r.result.createObjectStore(s.name,s.keyPath!=null?{keyPath:s.keyPath,autoIncrement:!!s.autoIncrement}:{autoIncrement:!!s.autoIncrement}); }); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
    for(const s of d.stores||[]){
      const keep=d.name==="hm-fs"&&s.name==="h"?await new Promise(res=>{ const q=db.transaction(s.name).objectStore(s.name).get("handle"); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }):null;
      await new Promise((res)=>{ const tx=db.transaction(s.name,"readwrite"); const os=tx.objectStore(s.name); os.clear();
        (s.rows||[]).forEach(([k,v])=>{ const val=xfDec(v,st); try{ if(os.keyPath!=null) os.put(val); else os.put(val,k); rec++; }catch(e){ console.warn("skip",k,e); } });
        if(keep) os.put(keep,"handle");
        tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); }); }
    db.close(); }
  return rec; }
async function importTransferHSH(T){

  Object.entries(T.localStorage||{}).forEach(([k,v])=>{ if(k===KEY){ try{ const o=JSON.parse(v); XF_SECRET_KEYS.forEach(x=>{ if(cur[x]!=null) o[x]=cur[x]; }); v=JSON.stringify(o); }catch(e){} }   /* ڕێکخستنی sync و کلیلی ئەم ئامێرە دەپارێزرێن */

  const rec=await xfRestoreIdb(T.indexedDB,st);

/* فایلی ئەپێکی تر (بۆ نموونە AMJ): هیچ داتایەکی HSH ناسڕدرێتەوە — فایلەکە وەک خۆی هەڵدەگیرێت و تەنها ناوی قوتابی/پۆل زیاد دەکرێت ئەگەر بناسرێتەوە */
function xfFindStudents(T){
  const found=[]; const seen=new Set();
  const visit=(o,ctx,depth)=>{ if(!o||typeof o!=="object"||depth>8) return;
    if(Array.isArray(o)){ o.forEach(x=>visit(x,ctx,depth+1)); return; }
    const nm=o.name||o.fullName||o.studentName||o.ناو; const sec=o.section||o.sec||o.class||o.className||o.بەش||ctx.sec; const gr=o.grade||o.stage||o.پۆل||ctx.grade;
    if(typeof nm==="string"&&nm.trim().length>2&&(o.student||o.studentName||o.attendance||o.marks||ctx.inStudents||sec)){ const k=nm.trim()+"|"+(sec||""); if(!seen.has(k)){ seen.add(k); found.push({name:nm.trim(),sec:sec?String(sec).trim():"",grade:gr?String(gr).trim():""}); } }
    Object.entries(o).forEach(([k,v])=>{ const c=Object.assign({},ctx); if(/^(students|classes|pupils|قوتابیان)$/i.test(k)) c.inStudents=true; if(/^[A-Zا-ی]$/.test(k)&&Array.isArray(v)) { c.sec=k; c.inStudents=true; } if(/^(10|11|12)$/.test(k)) c.grade=k; visit(v,c,depth+1); }); };
  Object.values(T.localStorage||{}).forEach(v=>{ try{ visit(JSON.parse(v),{},0); }catch(e){} });
  (T.indexedDB||[]).forEach(d=>(d.stores||[]).forEach(s=>(s.rows||[]).forEach(r=>visit(r[1],{},0))));
  return found; }

function xfFromAMT(T){ const o=Object.assign({},T,{app:"HSH",srcApp:"AMT"}); const ls={};

/* ===== AMT ← تەنها زیادکردنی زائید/ناقس/غیابی ڕۆژێکی دیاریکراو؛ هیچ شتێکی HSH ناسڕێتەوە و ناگۆڕێت ===== */

function xfMergeAMTDay(T,from,to,dry){
  const A=xfAMTState(T); if(!A||!A.stages) throw new Error("داتای AMT لەم فایلەدا نەدۆزرایەوە");
  const nn=x=>normName(x).replace(/\s+/g,"");
  const r={ev:0,plus:0,minus:0,att:0,attSame:0,attDiff:0,stu:0,miss:[],dup:0};
  Object.entries(A.stages).forEach(([g,ast])=>{ const hst=(S.stages||{})[g]; if(!ast||!ast.classes) return;
    Object.entries(ast.classes).forEach(([c,list])=>{ (list||[]).forEach(as=>{
      const evs=(as.events||[]).filter(e=>e&&e.date>=from&&e.date<=to);
      const atts=Object.entries(as.attendance||{}).filter(([d])=>d>=from&&d<=to);
      if(!evs.length&&!atts.length) return;
      let hs=null; if(hst){ hs=((hst.classes||{})[c]||[]).find(x=>nn(x.name)===nn(as.name));
        if(!hs) for(const cc of Object.keys(hst.classes||{})){ hs=(hst.classes[cc]||[]).find(x=>nn(x.name)===nn(as.name)); if(hs) break; } }
      if(!hs){ r.miss.push((as.name||"؟")+" ("+g+c+")"); return; }

      hs.events.forEach(x=>{ const k=key(x); have[k]=(have[k]||0)+1; });
      evs.forEach(e=>{ const k=key(e); if(have[k]>0){ have[k]--; r.dup++; return; }
        if(!dry) hs.events.push(Object.assign({},e,{src:"AMT"})); r.ev++; if((e.delta||0)>0) r.plus++; else if((e.delta||0)<0) r.minus++; });
      atts.forEach(([d,v])=>{ if(hs.attendance[d]==null){ if(!dry) hs.attendance[d]=v; r.att++; } else if(hs.attendance[d]===v) r.attSame++; else r.attDiff++; });
    }); }); });
  if(!dry) save(); return r; }

    <button class="btn btn-bz btn-sm" id="amtBBNext">🎲 یەکێکی تر</button></div>`; }
function amtBTimer(sec){ clearInterval(amtBBTimerId); let t=Math.max(0,sec|0);
  const draw=()=>{ const el=$("#amtBBClock"); if(!el){ clearInterval(amtBBTimerId); return; } el.textContent=kuNum(Math.floor(t/60))+":"+kuNum(String(t%60).padStart(2,"0")); el.style.color=t<=10?"var(--red)":""; };
  draw(); amtBBTimerId=setInterval(()=>{ t--; draw(); if(t<=0){ clearInterval(amtBBTimerId); try{ ding(); }catch(e){} toast("⏰ کاتی پشوو تەواو بوو"); } },1000); }
function amtBreak(pick){
  const list=AMT_BB.map((x,i)=>i).filter(i=>amtBBCat==="all"||AMT_BB[i][0]===amtBBCat);
  const cur=(typeof pick==="number"&&AMT_BB[pick])?pick:list[Math.floor(Math.random()*list.length)];
  $("#modal").innerHTML=`<div class="m-head"><button class="close" id="mClose">×</button><div class="m-name">🧠 پشووی مێشک</div>

        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${list.map(i=>`<button class="btn btn-gh btn-sm" data-bbpick="${i}">${(AMT_BB_CAT[AMT_BB[i][0]]||["🎲"])[0]} ${esc(AMT_BB[i][1])}</button>`).join("")}</div></details>
    </div>`;
  $("#overlay").classList.add("show"); $("#mClose").onclick=()=>{ clearInterval(amtBBTimerId); closeStudent(); };
  document.querySelectorAll("[data-bbcat]").forEach(b=>b.onclick=()=>{ amtBBCat=b.dataset.bbcat; amtBreak(); });
  document.querySelectorAll("[data-bbpick]").forEach(b=>b.onclick=()=>amtBreak(+b.dataset.bbpick));
  const st=document.querySelector("[data-bbstart]"); if(st) st.onclick=()=>amtBTimer(+st.dataset.bbstart);

  $("#amtFinishBtn").onclick=()=>{ keep(); amtFinish(); }; }
function amtFinish(){ const w=amtW; if(!w) return;
  S.profile=Object.assign({},S.profile||{},{name:w.name.trim(),school:w.school.trim(),dept:w.dept.trim()});
  /* بابەت: زیاد دەکرێت؛ لابردن تەنها بۆ ئەوانەی هیچ بەشێک بەکاری ناهێنێت (داتاکەیان لە stage.sd دەمێنێت) */
  const used=new Set(usedSubjects()); const defs=(S.subjDefs||[]).filter(d=>w.subj.has(d.key)||used.has(d.key));
  w.subj.forEach(k=>{ if(!defs.some(d=>d.key===k)){ const c=AMT_CAT.find(x=>x[0]===k)||[k,k,"📘"]; defs.push({key:c[0],name:c[1],ic:c[2]}); } });
  if(!defs.length) defs.push({key:"econ",name:"ئابووری",ic:"💰"}); S.subjDefs=defs; amtApplySubjects();
  S.amtGrades=[...w.grades]; let addC=0;
  [...w.grades].forEach(g=>{ if(!S.stages[g]) S.stages[g]=freshStageWith([...w.secs].sort()); const st=S.stages[g]; st.classes=st.classes||{}; st.groups=st.groups||{}; st.sections=st.sections||[];
    [...w.secs].forEach(x=>{ if(!st.sections.includes(x)){ st.sections.push(x); st.sections.sort(); addC++; } if(!st.classes[x]) st.classes[x]=[]; if(!(x in st.groups)) st.groups[x]=null;
      st.subj=st.subj||{}; if(!st.subj[x]) st.subj[x]=amtFirstSubj(); }); });
  save(); closeStudent(); render(); toast("✓ پرۆفایل پاشەکەوت کرا"+(addC?" · "+kuNum(addC)+" بەشی نوێ":"")); }

/* ===== AMT: 🧩 زیادکراوەکان — پارچە کۆدی بچووک؛ #safe لە کۆتایی لینک هەموویان ڕادەگرێت ===== */
const AMT_VIEWS={}; const AMT_BTNS=[];
const AMT={ version:1,
  get S(){ return S; }, save:()=>save(), render:()=>render(), renderMain:()=>renderMain(), toast:m=>toast(m), esc:x=>esc(x), $:q=>$(q), today:()=>todayISO(),
  view(key,label,fn,after){ if(!key||typeof fn!=="function") return; AMT_VIEWS[String(key)]={label:String(label||key),fn,after}; },
  button(label,fn,title){ if(typeof fn==="function") AMT_BTNS.push({label:String(label||"🧩"),fn,title}); },
  students(){ return curList(); }, subject(){ return SUBJ(); } };
function amtRunAddons(){ AMT_BTNS.length=0; Object.keys(AMT_VIEWS).forEach(k=>delete AMT_VIEWS[k]);
  if(location.hash==="#safe"){ setTimeout(()=>toast("🛡️ حاڵەتی پارێزراو (#safe): زیادکراوەکان ڕاگیراون"),900); return; }
  (S.addons||[]).forEach(a=>{ if(!a||!a.on) return; try{ (new Function("AMT","S",String(a.code||"")))(AMT,S); a.err=""; }catch(e){ a.err=String(e&&e.message||e); console.warn("addon",a.name,e); } }); }
function amtAddonPanel(){ const L=S.addons||[];
  return `<div class="panel"><h3>🧩 زیادکراوەکان</h3>
    <p class="hint">پارچە کۆدی بچووکی JavaScript بۆ زیادکردنی بەش یان دوگمە. ئەگەر زیادکراوێک ئەپەکەی تێکدا، <b>#safe</b> بخەرە کۆتایی لینکەکە (بۆ نموونە <code>hsh.html#safe</code>) تا هەموویان ڕابگیرێن. نموونە: <code>AMT.button("👋",()=>AMT.toast("سڵاو"))</code></p>
    ${L.length?L.map(a=>`<div class="rchip" style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b style="flex:1">${esc(a.name||"بێ ناو")}</b>
      <span class="hint">${a.on?"✅ چالاک":"⏸ ڕاگیراو"}${a.err?` · <span style="color:var(--red)">⚠️ ${esc(a.err)}</span>`:""}</span>
      <button class="btn btn-gh btn-sm" data-adtog="${a.id}">${a.on?"⏸ ڕاگرتن":"▶ چالاککردن"}</button>
      <button class="x" data-addel="${a.id}" title="سڕینەوە">×</button></div>`).join(""):`<div class="hint">هێشتا هیچ زیادکراوێک نییە.</div>`}
    <input class="topic-in" id="adName" placeholder="ناوی زیادکراو" style="margin-top:8px">
    <textarea class="topic-in" id="adCode" rows="4" placeholder="کۆد…" style="width:100%;font-family:monospace;direction:ltr;text-align:left;margin-top:6px"></textarea>
    <button class="btn btn-pri btn-sm" id="adAdd" style="margin-top:6px">＋ زیادکردن</button></div>`; }
function amtAddonAdd(){ const n=($("#adName")||{}).value||"", c=($("#adCode")||{}).value||"";
  if(!c.trim()){ toast("کۆد بنووسە"); return; } S.addons=S.addons||[];
  S.addons.push({id:uid(),name:n.trim()||("زیادکراوی "+(S.addons.length+1)),code:c,on:true,err:""}); save(); amtRunAddons(); render(); toast("🧩 زیادکرا"); }
function amtAddonToggle(id){ const a=(S.addons||[]).find(x=>x.id===id); if(!a) return; a.on=!a.on; save(); amtRunAddons(); render(); }
function amtAddonDel(id){ const a=(S.addons||[]).find(x=>x.id===id); if(!a) return; if(!confirm("زیادکراوی «"+(a.name||"")+"» بسڕدرێتەوە؟")) return;
  S.addons=S.addons.filter(x=>x.id!==id); save(); amtRunAddons(); render(); }

function exportData(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="AMT-Eco-backup-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("فایلی پاشەکەوت دروستکرا");
  }catch(e){ toast("داگرتن سەرکەوتوو نەبوو"); }
}
function countStudents(st){
  try{
    if(st.stages){ let n=0; Object.values(st.stages).forEach(g=>{ const secs=g.sections||Object.keys(g.classes||{}); secs.forEach(k=>n+=((g.classes||{})[k]||[]).length); }); return n; }
    if(st.classes){ return Object.values(st.classes).reduce((a,arr)=>a+(arr||[]).length,0); }
  }catch(e){}
  return 0;
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.classes && !data.stages) throw new Error("invalid");
      const n=countStudents(data);
      const yr=data.year?(" ساڵی "+data.year):"";
      if(!confirm("ئەم فایلە "+n+" قوتابی تێدایە"+yr+".\nگەڕاندنەوەی بکرێت؟ داتای ئێستای ئەم ئامێرە لەسەری دەنووسرێتەوە.\n(پێشنیار: سەرەتا داتای ئێستات پاشەکەوت بکە.)")) return;
      S=Object.assign(newState(),migrate(data));
      save(); render(); toast(n+" قوتابی بەسەرکەوتوویی گەڕێنرایەوە");
    }catch(e){ toast("فایلەکە دروست نییە یان تێکچووە"); }
  };
  r.readAsText(file);
}

/* ---- util ---- */
function fmt(n){return n>0?"+"+n:(""+n);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---- boot ---- */
(async function(){
  await load();
  await tryReconnectDrive();
  await loadDrivePacks(); if(applyDrivePacks()) await store.set(KEY,JSON.stringify(S));
  try{ const rv=reviveAll(); if(rv){ await store.set(KEY,JSON.stringify(S)); setTimeout(()=>toast("🔁 مێژووی "+rv+" قوتابی لە ئەرشیفەوە گەڕێنرایەوە"),1500); } }catch(e){ console.warn("revive",e); }
  if(S.view==="live"&&!syncOn()) S.view="room";
  try{ amtApplySubjects(); amtRunAddons(); }catch(e){ console.warn("amt",e); }
  await syncFromHash();
  render();
  startSyncLoop();
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
