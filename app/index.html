<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMT Eco.">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>AMT Eco. · ئامادەیی ئەحمەد موختار جاف</title>
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMT Eco.">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231F4E79'/><text x='50' y='70' font-size='30' letter-spacing='1' text-anchor='middle' fill='%23A8722A' font-family='serif' font-weight='bold'>AMT</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#20283A; --ink-soft:#56627C; --ink-faint:#8A93A6;
  --paper:#FBFAF7; --panel:#FFFFFF; --line:#E8E3D9; --line-soft:#F0ECE3;
  --lapis:#1F4E79; --lapis-d:#173A5C; --lapis-soft:#EAF1F7;
  --bronze:#A8722A; --bronze-soft:#F6EDDB;
  --green:#3F7D5A; --green-soft:#E7F1EB;
  --amber:#C0871F; --amber-soft:#FBF1DA;
  --red:#AB453A; --red-soft:#F7E9E6;
  --shadow:0 1px 2px rgba(32,40,58,.05),0 8px 24px rgba(32,40,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Rabar_013','Vazirmatn',-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:var(--paper); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D8D2C6;border-radius:8px}

/* ---------- Header ---------- */
header{
  background:var(--lapis);
  background:linear-gradient(180deg,#22557F 0%,var(--lapis-d) 100%);
  color:#fff; padding:14px 22px;
  border-bottom:3px solid var(--bronze);
}
.head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:13px}
.monogram{
  width:46px;height:46px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,#C28A35,#9A641F);
  display:flex;align-items:center;justify-content:center;
  font-family:'Rabar_013','Amiri',serif;font-size:26px;color:#fff;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.wordmark{font-family:'Rabar_013','Amiri',serif;font-size:27px;font-weight:700;letter-spacing:.3px;line-height:1.15}
.tagline{font-size:12.5px;color:#C9D8E8;font-weight:500;margin-top:1px}
.year-pill{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  padding:5px 13px;border-radius:20px;font-size:13px;font-weight:600;
}
.dev-btn{
  background:var(--bronze);color:#fff;border:1px solid rgba(255,255,255,.3);
  padding:6px 15px;border-radius:20px;font-size:13px;font-weight:700;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.dev-btn:hover{filter:brightness(1.07)}

/* class tabs */
.classbar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.classbar .lbl{font-size:13px;color:#C9D8E8;font-weight:500;margin-left:4px}
.ctab{
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.22);
  padding:6px 18px;border-radius:9px;font-size:14.5px;font-weight:600;transition:.15s;
}
.ctab:hover{background:rgba(255,255,255,.2)}
.ctab.on{background:#fff;color:var(--lapis-d);border-color:#fff}
.ctab .cnt{font-size:11.5px;opacity:.7;margin-right:5px}

/* ---------- Nav ---------- */
nav{
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:0 18px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:30;
}
.nbtn{
  background:none;border:none;padding:14px 16px;font-size:14.5px;font-weight:600;
  color:var(--ink-soft);border-bottom:3px solid transparent;transition:.15s;white-space:nowrap;
}
.nbtn:hover{color:var(--ink)}
.nbtn.on{color:var(--lapis);border-bottom-color:var(--bronze)}

/* ---------- Layout ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 18px;box-shadow:var(--shadow);margin-bottom:20px;
}
.bar .date{font-weight:600;font-size:14px;color:var(--ink-soft)}
.topic-in{
  flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;font-size:14.5px;background:var(--paper);color:var(--ink);
}
.topic-in:focus{outline:none;border-color:var(--lapis);background:#fff}

.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;transition:.15s}
.btn-pri{background:var(--lapis);color:#fff}
.btn-pri:hover{background:var(--lapis-d)}
.btn-gh{background:var(--lapis-soft);color:var(--lapis)}
.btn-gh:hover{background:#dde9f3}
.btn-bz{background:var(--bronze);color:#fff}
.btn-bz:hover{filter:brightness(.94)}
.btn-sm{padding:6px 12px;font-size:13px}

/* attendance toggle */
.att-toggle{display:flex;align-items:center;gap:9px;background:var(--bronze-soft);
  border:1px solid #E9D8B4;border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;color:#7A551A}

h2.sec{font-family:'Rabar_013','Amiri',serif;font-size:23px;font-weight:700;margin:6px 0 4px;color:var(--ink)}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px}

/* ---------- Student cards (classroom) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;box-shadow:var(--shadow);position:relative;transition:.15s;
}
.card:hover{border-color:#D8D0BF}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.sname{font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);border:none;background:none;padding:0;text-align:right}
.sname:hover{color:var(--lapis);text-decoration:underline}
.lvl{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;flex:none}
.lvl-z{background:var(--green-soft);color:var(--green)}
.lvl-b{background:var(--lapis-soft);color:var(--lapis)}
.lvl-n{background:var(--line-soft);color:var(--ink-soft)}
.lvl-l{background:var(--red-soft);color:var(--red)}

.scores{display:flex;gap:8px;margin-bottom:11px}
.chip{flex:1;text-align:center;border-radius:9px;padding:6px 4px;border:1px solid var(--line)}
.chip .n{font-size:19px;font-weight:700;line-height:1}
.chip .t{font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-top:2px}
.chip.pos .n{color:var(--green)} .chip.beh .n{color:var(--bronze)}

/* attendance row inside card */
.att-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.att-btn{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;
  padding:7px 2px;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:.12s}
.att-btn:hover{border-color:#cfc8b8}
.att-btn.on-p{background:var(--green);color:#fff;border-color:var(--green)}
.att-btn.on-l{background:var(--amber);color:#fff;border-color:var(--amber)}
.att-btn.on-a{background:var(--red);color:#fff;border-color:var(--red)}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 6px;
  font-size:12.5px;font-weight:600;color:var(--ink);transition:.12s;display:flex;align-items:center;justify-content:center;gap:5px}
.act:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.act:active{transform:translateY(0)}
.act .d{font-weight:700;font-size:13px}
.act.gp{color:var(--green)} .act.gp:hover{background:var(--green-soft);border-color:#bfe0cc}
.act.bp{color:var(--bronze)} .act.bp:hover{background:var(--bronze-soft);border-color:#e9d8b4}
.act.bn{color:var(--red)} .act.bn:hover{background:var(--red-soft);border-color:#eccfc9}
.act.wide{grid-column:1/-1}
.absent-note{font-size:12.5px;color:var(--red);text-align:center;padding:8px;font-weight:600}

/* ---------- Leaderboard ---------- */
.lb{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.lb-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line-soft)}
.lb-row:last-child{border-bottom:none}
.rank{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;background:var(--line-soft);color:var(--ink-soft)}
.rank.g1{background:var(--bronze);color:#fff}
.rank.g2{background:#C2C7CF;color:#fff} .rank.g3{background:#D8B589;color:#fff}
.lb-name{flex:1;font-weight:700;font-size:15.5px;cursor:pointer}
.lb-name:hover{color:var(--lapis)}
.badge{font-size:11px;font-weight:600;color:var(--bronze);background:var(--bronze-soft);
  padding:3px 10px;border-radius:20px;border:1px solid #ecdcb6}
.lb-score{font-weight:700;font-size:17px;color:var(--green);min-width:42px;text-align:left}

/* ---------- Generic table ---------- */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:14px}
th{background:var(--lapis-soft);color:var(--lapis-d);font-weight:700;padding:11px 14px;text-align:right;font-size:13px}
td{padding:11px 14px;border-top:1px solid var(--line-soft)}
tr:hover td{background:#FCFBF8}
.t-num{font-weight:700}
.t-g{color:var(--green)} .t-r{color:var(--red)} .t-a{color:var(--amber)}

/* ---------- Methodology cards ---------- */
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:24px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);position:relative}
.mcard .step{font-family:'Rabar_013','Amiri',serif;font-size:34px;font-weight:700;color:var(--bronze-soft);
  position:absolute;top:8px;left:14px;line-height:1}
.mcard h3{font-size:16.5px;margin:0 0 7px;color:var(--lapis-d);font-weight:700}
.mcard p{font-size:13.5px;color:var(--ink-soft);margin:0}
.planner{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.planner label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px;color:var(--ink)}
.planner textarea,.planner input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  font-size:14px;background:var(--paper);color:var(--ink);resize:vertical}
.planner textarea:focus,.planner input:focus{outline:none;border-color:var(--lapis);background:#fff}

/* ---------- Settings ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h3{margin:0 0 4px;font-size:17px;color:var(--ink)}
.panel .hint{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.rchip{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px;font-size:13.5px;font-weight:600}
.rchip select{border:1px solid var(--line);border-radius:6px;padding:2px 5px;font-size:12px;background:#fff}
.rchip .x{border:none;background:none;color:var(--red);font-weight:700;font-size:15px;line-height:1;padding:0 2px}
.bulk{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;background:var(--paper);resize:vertical}
.bulk:focus{outline:none;border-color:var(--lapis);background:#fff}

/* empty */
.empty{text-align:center;padding:50px 20px;color:var(--ink-faint)}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.5}
.empty p{margin:4px 0;font-size:15px}

/* ---------- Modal (student dashboard) ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.55);display:none;z-index:100;
  align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:18px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.m-head{background:var(--lapis);background:linear-gradient(180deg,#22557F,var(--lapis-d));color:#fff;padding:20px 24px;position:relative}
.m-head .close{position:absolute;left:18px;top:18px;background:rgba(255,255,255,.15);border:none;color:#fff;
  width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.m-head .close:hover{background:rgba(255,255,255,.28)}
.m-name{font-family:'Rabar_013','Amiri',serif;font-size:25px;font-weight:700}
.m-meta{font-size:13px;color:#C9D8E8;margin-top:3px}
.m-body{padding:22px 24px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.stat .v{font-size:24px;font-weight:700;line-height:1}
.stat .k{font-size:12px;color:var(--ink-faint);font-weight:600;margin-top:4px}
.log-sec h4{font-size:15px;margin:18px 0 9px;color:var(--lapis-d);display:flex;align-items:center;gap:8px}
.log-sec h4::before{content:"";width:4px;height:16px;background:var(--bronze);border-radius:2px}
.logline{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);
  border:1px solid var(--line-soft);border-radius:9px;margin-bottom:6px;font-size:13.5px}
.logline .dt{color:var(--ink-faint);font-size:12.5px;min-width:92px;font-weight:600}
.logline .dl{font-weight:700;margin-right:auto}
.dl.p{color:var(--green)} .dl.n{color:var(--red)}
.statusdot{width:9px;height:9px;border-radius:50%;flex:none}
.sd-p{background:var(--green)} .sd-l{background:var(--amber)} .sd-a{background:var(--red)} .sd-o{background:#7A6CA8}

.reason-in{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;color:var(--ink)}
.reason-in:focus{outline:none;border-color:var(--lapis)}
.att-btn.on-o{background:#7A6CA8;color:#fff;border-color:#7A6CA8}
.att-btn.on-y{background:#1F7A8C;color:#fff;border-color:#1F7A8C}
.sd-y{background:#1F7A8C}
.att-btn.on-m{background:#6A7F2E;color:#fff;border-color:#6A7F2E}
.sd-m{background:#6A7F2E}
.aq-c.aq-leave{background:#eef3e0;border-color:#c5d39a;color:#4a5a1c;font-weight:700}
.aq-c.aq-yard{background:#e0f2f5;border-color:#a9d6df;color:#145563;font-weight:700}

.seg{display:inline-flex;background:var(--line-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--lapis);box-shadow:var(--shadow)}

.cal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-top h3{font-family:'Rabar_013','Amiri',serif;font-size:21px;margin:0;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-faint);padding:4px 0}
.cal-cell{min-height:74px;border:1px solid var(--line-soft);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:2px;background:var(--paper);font-size:13px}
.cal-cell.empty{background:transparent;border:none}
.cal-cell.has{cursor:pointer;background:#fff;border-color:var(--line)}
.cal-cell.has:hover{border-color:var(--lapis);box-shadow:var(--shadow)}
.cal-cell.today{outline:2px solid var(--bronze);outline-offset:-1px}
.cal-num{font-weight:700;color:var(--ink)}
.cal-tag{font-size:10.5px;color:var(--lapis);font-weight:600;line-height:1.2;overflow:hidden;max-height:26px}
.cal-dots{display:flex;gap:3px;margin-top:auto}
.cal-dot{width:7px;height:7px;border-radius:50%}

.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);background:#fff}
.gtable{min-width:1180px;border:none;border-radius:0;box-shadow:none;font-size:12.5px}
.gtable th{padding:7px 7px;font-size:11px;line-height:1.25;border:1px solid #dfe6ee}
.gtable td{padding:4px 6px;text-align:center;border:1px solid var(--line-soft)}
.gtable td:nth-child(2){text-align:right;white-space:nowrap}
.gin{width:48px;border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;font-size:12.5px;background:#fff;color:var(--ink)}
.ginwrap{position:relative;display:inline-flex;align-items:center}
.ginwrap .gin{width:46px;padding-left:13px}
.ginbtns{position:absolute;left:1px;top:1px;bottom:1px;display:flex;flex-direction:column;width:12px}
.ginbtns .gstep{flex:1;border:none;background:transparent;cursor:pointer;font-size:7px;line-height:1;color:var(--ink-faint);padding:0}
.ginbtns .gstep:hover{color:var(--lapis)}
.gin:focus{outline:none;border-color:var(--lapis);background:#fff}
.gin.auto{background:var(--lapis-soft);border-color:#cfe0f0}
.gin::placeholder{color:var(--lapis);opacity:.85}
.gres{font-weight:700;background:#FAFBFC}
.gpass{color:var(--green);font-weight:700} .gfail{color:var(--red);font-weight:700}
.gtable tfoot .gfoot td{background:var(--paper);font-weight:700;font-size:11.5px;border-color:#d8c4a4}
.gtable tfoot .gfoot td:first-child{text-align:right;color:var(--bronze)}
.gtable tfoot tr:first-child td{border-top:2px solid var(--bronze)}
.glegend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.glegend b{color:var(--ink)}
.dot-auto{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--lapis-soft);border:1px solid #cfe0f0;vertical-align:-1px;margin-left:4px}

.les-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.les-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;min-height:80px;display:flex;flex-direction:column;gap:5px}
.les-card:hover{border-color:var(--lapis);transform:translateY(-1px)}
.les-num{font-family:'Rabar_013','Amiri',serif;font-size:15px;font-weight:700;color:var(--lapis-d)}
.les-title{font-size:13px;color:var(--ink);font-weight:600;line-height:1.3}
.les-meta{margin-top:auto;font-size:11.5px;color:var(--ink-faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.les-chip{background:var(--lapis-soft);color:var(--lapis);border-radius:6px;padding:1px 7px;font-weight:600}
.mat-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;margin-bottom:7px}
.mat-ic{width:30px;height:30px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--bronze-soft)}
.mat-lbl{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addmat{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;align-items:center;margin-top:10px}
@media(max-width:640px){.addmat{grid-template-columns:1fr 1fr}}

@media print{
  header,nav,.bar,.m-foot,.m-head .close{display:none!important}
  body{background:#fff}
  .overlay.show{position:static;padding:0;background:#fff;display:block}
  .modal{box-shadow:none;max-width:100%}
  body.printing > *{display:none !important}
  body.printing > #printArea{display:block !important}
  /* هەر قوتابییەک لە لاپەڕەی خۆی — ئەگەر درێژتر بوو دەڕواتە لاپەڕەی دواتر و قوتابی داهاتوو لە لاپەڕەی نوێ دەست پێدەکات */
  body.printing .pcard{page-break-after:always;page-break-inside:auto;break-inside:auto}
  body.printing .pcard:last-child{page-break-after:auto}
  /* تۆماری نمرە: هەموو ستوونەکان بگونجێن لە لاپەڕەی خواروودا */
  body.printing .pr-land table{width:100%!important;min-width:0!important;border-collapse:collapse;font-size:9px;table-layout:auto}
  body.printing .pr-land th{font-size:8px;padding:3px 2px!important;border:1px solid #999}
  body.printing .pr-land td{font-size:9px;padding:2px 2px!important;border:1px solid #bbb;text-align:center}
  body.printing #printArea table{border-collapse:collapse}
  body.printing #printArea th,body.printing #printArea td{border:1px solid #999}
}

<script>
/* ============================================================
   AMT Eco. — سیستەمی وانەی ئابووری (لەسەر بنەمای HSH)
   ============================================================ */

/* ---- persistence: window.storage with in-memory fallback ---- */
const KEY = "amteco:state:v1";
const mem = {};
/* بیرگە: سەرەتا IndexedDB (جێگای زۆر، بۆ پاکێجی وانەکانی هەر سێ پۆل)، ئەگەر نەبوو localStorage */
function idbPut(k,v){ return idb().then(db=>new Promise(res=>{ try{ const t=db.transaction("h","readwrite"); t.objectStore("h").put(v,k); t.oncomplete=()=>res(true); t.onerror=t.onabort=()=>res(false); }catch(e){ res(false); } })).catch(()=>false); }
const store = {
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k); return r? r.value : null;} }catch(e){}
    try{ const v=await idbGet("ls:"+k); if(v!=null) return v; }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    const ok=await idbPut("ls:"+k,v);
    try{ if(!ok||String(v).length<400000) localStorage.setItem(k,v); else localStorage.removeItem(k); }
    catch(e){ try{ if(ok) localStorage.removeItem(k); }catch(_){} if(!ok) console.warn("⚠️ بیرگە پڕە",k); }
  }
};

/* ---- default state ---- */
const LEVELS = [["لاواز","l"],["ناوەند","n"],["باش","b"],["زۆر باش","z"]];
const STAGES = ["10","11","12"];
function newStage(){ return { sections:["A","B","C"], classes:{ A:[], B:[], C:[] }, groups:{ A:null, B:null, C:null }, topics:{}, plan:{}, book:{link:"",file:""}, lessons:{t1:{},t2:{}} }; }
function freshStageWith(sections){ const st=newStage(); st.sections=sections.slice(); st.classes={}; st.groups={}; sections.forEach(k=>{st.classes[k]=[];st.groups[k]=null;}); return st; }
function newState(){
  return {
    year:"٢٠٢٦ – ٢٠٢٧",
    stage:"10",
    active:"A",
    view:"room",
    reportPeriod:"month", calMonth:null, lessonTerm:"t1", callLesson:1,
    devUrl:"https://claude.ai/", driveUrl:"", apiKey:"",
    terms:{ start:"2026-09-20", t1mid:"2026-11-12", t1end:"2026-12-31", t2start:"2027-01-03", t2mid:"2027-02-25", t2end:"2027-04-30" },
    rubric:{ att:2, part:2, quiz:4, beh:2, partTarget:8, quizOutOf:10 }, rubV:2,
    stages:{ "10":freshStageWith(["A","B","C"]), "11":freshStageWith(["A"]), "12":freshStageWith(["A","B","C","D","E","F","G"]) }, subjV:1, planV:5, planEcoV:0,
    archives:[],
    amtLevel:"pro", subjDefs:[{key:"econ",name:"ئابووری",ic:"💰"}],
    profile:{}, amtGrades:[], addons:[], spMaps:false
  };
}
function ST(){
  if(!S.stages) S.stages={ "10":newStage(), "11":newStage(), "12":newStage() };
  if(!S.stages[S.stage]) S.stages[S.stage]=newStage();
  const st=S.stages[S.stage];
  if(!st.book) st.book={link:"",file:""};
  if(!st.lessons) st.lessons={t1:{},t2:{}};
  st.classes=st.classes||{}; st.groups=st.groups||{};
  if(!st.sections || !st.sections.length){ st.sections=Object.keys(st.classes); if(!st.sections.length) st.sections=["A","B","C"]; }
  st.sections.forEach(k=>{ if(!st.classes[k]) st.classes[k]=[]; if(!(k in st.groups)) st.groups[k]=null; });
  if(!st.bank) st.bank=[];
  return st;
}
function ensureActive(){ const st=ST(); if(!st.sections.includes(S.active)) S.active=st.sections[0]||"A"; }
function nextSectionLetter(st){ for(let i=0;i<26;i++){ const L=String.fromCharCode(65+i); if(!st.sections.includes(L)) return L; } return null; }
function addSection(){
  const st=ST(); const next=nextSectionLetter(st);
  if(!next){ toast("ناتوانیت زیاتر بەش زیاد بکەیت"); return; }
  st.sections.push(next); st.sections.sort();
  st.classes[next]=[]; st.groups[next]=null;
  S.active=next; save(); render(); toast("بەشی "+next+" زیادکرا");
}
function removeSection(key){
  const st=ST();
  if(st.sections.length<=1){ toast("پێویستە لانیکەم یەک بەش بمێنێتەوە"); return; }
  if(!confirm("سڕینەوەی بەشی "+key+"؟ هەموو ناوەکان و تۆمارەکانی ئەم بەشە دەسڕێنەوە.")) return;
  st.sections=st.sections.filter(k=>k!==key);
  delete st.classes[key]; delete st.groups[key];
  if(S.active===key) S.active=st.sections[0];
  save(); render(); toast("بەشی "+key+" سڕایەوە");
}
function stageCount(g){ const st=S.stages&&S.stages[g]; if(!st)return 0; const secs=st.sections||Object.keys(st.classes||{}); return secs.reduce((a,k)=>a+((st.classes[k]||[]).length),0); }
function migrate(o){
  if(!o) return o;
  if(o.classes && !o.stages){
    const st=newStage();
    st.classes=o.classes; st.topics=o.topics||{}; st.plan=o.plan||{}; st.groups=o.groups||{A:null,B:null,C:null};
    o.stages={ "10":st, "11":newStage(), "12":newStage() };
    o.stage="10";
    delete o.classes; delete o.topics; delete o.plan; delete o.groups;
  }
  if(!o.stages) o.stages={ "10":newStage(), "11":newStage(), "12":newStage() };
  if(!o.stage) o.stage="10";
  if(!o.terms) o.terms={ start:"2026-09-15", t1mid:"2026-11-15", t1end:"2027-01-15", t2mid:"2027-04-01", t2end:"2027-06-10" };
  if(!o.rubric || o.rubric.quiz==null) o.rubric={ att:2, part:2, quiz:4, beh:2, partTarget:8, quizOutOf:10 };
  if(o.rubV!==2){ o.rubric={ att:2, part:2, quiz:4, beh:2, partTarget:(o.rubric&&o.rubric.partTarget)||8, quizOutOf:(o.rubric&&o.rubric.quizOutOf)||10 }; o.rubV=2; }
  if(!o.devUrl) o.devUrl="https://claude.ai/";
  if(o.stages&&o.stages["10"]&&!o.subjV){ const g=o.stages["10"]; g.subj=g.subj||{}; if(!g.subj.C) g.subj.C="hr"; o.subjV=1; }
  if(!o.driveUrl) o.driveUrl="";
  /* AMT: ئاست، بابەتەکان، پرۆفایل، زیادکراوەکان — داتای کۆن وەک خۆی دەمێنێت */
  if(!o.amtLevel) o.amtLevel="pro";

function compressImage(file, maxDim, quality){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        const scale=Math.min(1, maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(c.toDataURL("image/jpeg", quality)); }catch(e){ rej(e); }
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function fixKurdishText(t){
  if(!t) return t;
  let s=t.normalize? t.normalize("NFKC") : t;   // presentation forms → normal
  // legacy detection: Ali-K text CANNOT contain Kurdish unicode letters (font didn't have them)
  const hasKurdishUni=/[ەێۆڵڕپچژگڤ]/.test(s);
  const signals=(s.match(/[يی]\u064E|و\u064E|ل\u064E|ر\u0650|ة/g)||[]).length;
  const legacy=!hasKurdishUni && signals>=2;
  // safe universal normalizations (Arabic yeh/kaf → Kurdish)
  s=s.replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک");
  if(legacy){
    s=s
      .replace(/لا\u064E/g,"ڵا")
      .replace(/ل\u064Eا/g,"ڵا")
      .replace(/ی\u064E/g,"ێ")
      .replace(/و\u064E/g,"ۆ")
      .replace(/ل\u064E/g,"ڵ")
      .replace(/ر\u0650/g,"ڕ")
      .replace(/ط/g,"گ")
      .replace(/ظ/g,"ڤ")
      .replace(/ض/g,"چ")
      .replace(/ث/g,"پ")
      .replace(/ذ/g,"ژ")
      .replace(/ة/g,"ە")
      .replace(/ه(?![\u0600-\u06FF\u200C])/g,"ە")   // heh at word end → ە
      .replace(/[\u064B-\u0652\u0670]/g,"");        // strip leftover harakat
    return s;
  }
  // ===== دۆخی دووەم: ە بووەتە ه و لە وشەکان جیا بووەتەوە (PDFی کتێبەکان) =====
  s=s.replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g," ");   // هەموو جۆرە بۆشاییەکان → بۆشایی ئاسایی
  const hehCount=(s.match(/[هھ]/g)||[]).length, aeCount=(s.match(/ە/g)||[]).length;
  const detachSig=(s.match(/ [هھ][\u0600-\u06FF]|[\u0600-\u06FF][هھ] /g)||[]).length;
  if(hehCount>=3 && detachSig>=2 && aeCount<hehCount*0.5){
    s=s.replace(/ھ/g,"ه");
    s=s.replace(/[\u200B-\u200F\uFEFF]/g,"");
    // "X هY" → "XەY": ە کە لە سەرەتای پارچەی دواوە نووساوە
    s=s.replace(/([\u0600-\u06FF]) +ه(?=[\u0600-\u06FF])/g,"$1ە");
    // ه لە کۆتایی پارچە (دوای ئەو حاڵەتانە) → ە
    s=s.replace(/ه(?![\u0600-\u06FF])/g,"ə");   // نیشانەی کاتی
    s=s.replace(/ه(?=ی(?![\u0600-\u06FF]))/g,"ə"); // ...هی لە کۆتایی وشە → ...ەی
    s=s.replace(/ə/g,"ە");
    // " ە" → بنووسێنە بە وشەی پێشەوە
    s=s.replace(/([\u0600-\u06FF]) +ە/g,"$1ە");
    // بەشە دابڕاوەکان ببەستەوە: وشەی کۆتایی-ە + پارچەی دوای
    const WL=new Set(["لە","بە","کە","نە","بووە","هەیە","نییە","ئێمە","ئێوە","بۆیە","چونکە","لەوە","بەوە","کراوە","دراوە"]);
    const SUF=new Set(["ی","وە","دا","کان","کانی","کە","ش","مان","تان","یان","مین","وت","وتن","تی","تیی"]);
    let prev="";
    while(prev!==s){
      prev=s;
      s=s.replace(/([\u0600-\u06FF]*ە) +(?=([\u0600-\u06FF]+))/g,(all,x,y)=>{
        const join = SUF.has(y) || (!WL.has(x) && x.length<=5 && y.length>=2);
        return join? x : (x+" ");
      });
    }
  }
  return s;
}

function classroomMark(s,w){
  const R=S.rubric;
  const inW=d=> (w.inc? d>=w.from : d>w.from) && d<=w.to;
  const ev=(s.events||[]).filter(e=>inW(e.date));
  const att=Object.entries(s.attendance||{}).filter(([d])=>inW(d));
  if(!ev.length && !att.length) return null;   // هیچ زانیارییەک نییە ← نمرە نییە
  // attendance
  let attMark=0;   // تەنها لە غیابی تۆمارکراوەوە
  if(att.length){ let lost=0; att.forEach(([d,v])=>{ if(v==="absent"||v==="yard")lost+=1; else if(v==="out")lost+=0.75; else if(v==="late")lost+=0.5; }); attMark=R.att*Math.max(0,(att.length-lost)/att.length); }
  // participation
  const partNet=ev.filter(e=>e.type==="part"||e.type==="quiz"||e.type==="hw").reduce((a,e)=>a+e.delta,0);
  const partMark=R.part*clamp(partNet/(R.partTarget||8),0,1);
  // quiz scores (actual marks)
  const qz=ev.filter(e=>e.type==="quizscore" && e.max>0);
  let quizMark=0;  // تەنها ئەگەر کویز تۆمارکرابێت
  if(qz.length){ const pct=qz.reduce((a,q)=>a+(q.score/q.max),0)/qz.length; quizMark=R.quiz*clamp(pct,0,1); }
  // behavior
  const behEv=ev.filter(e=>e.type==="beh"); const behNet=behEv.reduce((a,e)=>a+e.delta,0);
  const behMark=behEv.length?clamp(R.beh+behNet*0.5,0,R.beh):0;   // تەنها ئەگەر هەڵسوکەوت تۆمارکرابێت
  const cap=(R.att||0)+(R.part||0)+(R.quiz||0)+(R.beh||0);
  return clamp(attMark+partMark+quizMark+behMark,0,cap||10);
}
function termData(s,term){
  const W=gwindows();
  const w=term==="t1"?[W.a1,W.a2]:[W.b1,W.b2];
  const m=sm(s,term);
  const L1=glOf(term+"h1")&&m.lk1!==undefined, L2=glOf(term+"h2")&&m.lk2!==undefined;   /* جێگیرکراو: نمرەکە وەک خۆی دەمێنێت */
  const auto1=L1?m.lk1:classroomMark(s,w[0]), auto2=L2?m.lk2:classroomMark(s,w[1]);
  const c1=L1?m.lk1:(m.mk1!=null?Number(m.mk1):auto1);
  const c2=L2?m.lk2:(m.mk2!=null?Number(m.mk2):auto2);
  const e20=num(m.e20), e60=num(m.e60);
  return {auto1,auto2,c1,c2,e20,e60,total:Math.round(((c1||0)+e20+(c2||0)+e60)*2)/2};
}
function computeStudent(s){
  const t1=termData(s,"t1"), t2=termData(s,"t2");
  const m1=sm(s,"t1"), m2=sm(s,"t2");
  const round=Math.round((t1.total+t2.total)/2);
  const q1 = m1.mu!=null ? clamp(Number(m1.mu)+(t1.c1||0)+(t1.c2||0),0,100) : null;
  const q2 = m2.mu!=null ? clamp(Number(m2.mu)+(t2.c1||0)+(t2.c2||0),0,100) : null;
  const t1fail=t1.total<PASS, t2fail=t2.total<PASS;
  let finalv, status, pass;
  if(round>=PASS){ finalv=round; pass=true; status="دەرچوو (خولی ١)"; }
  else {
    const f1 = t1fail ? q1 : t1.total;
    const f2 = t2fail ? q2 : t2.total;
    if(f1==null || f2==null){ finalv=null; pass=false; status="خولی دووەم"; }
    else { finalv=Math.round((f1+f2)/2); pass=finalv>=PASS; status= pass?"دەرچوو (خولی ٢)":"کەوتوو"; }
  }
  return {t1,t2,round,q1,q2,finalv,status,pass,t1fail,t2fail};
}

const _j=x=>JSON.stringify(x);

function merge3(b,l,r){
  if(_j(l)===_j(r)) return l; if(b!==undefined&&_j(l)===_j(b)) return r; if(b!==undefined&&_j(r)===_j(b)) return l;
  if(l===undefined) return r; if(r===undefined) return l;
  if(Array.isArray(l)&&Array.isArray(r)) return mergeArr(Array.isArray(b)?b:[],l,r);
  if(_isO(l)&&_isO(r)){ const bb=_isO(b)?b:{}; const o={};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{ const inL=k in l, inR=k in r, inB=k in bb;
      if(inL&&inR) o[k]=merge3(bb[k],l[k],r[k]);
      else if(inL){ if(!(inB&&_j(bb[k])===_j(l[k]))) o[k]=l[k]; }
      else { if(!(inB&&_j(bb[k])===_j(r[k]))) o[k]=r[k]; } });
    return o; }
  return l;
}
function mergeArr(b,l,r){
  const hasId=x=>_isO(x)&&(x.id!=null||x.k!=null); const key=x=>hasId(x)?"#"+(x.id!=null?x.id:"k"+x.k):"~"+_j(x);
  const cnt=a=>{ const m=new Map(); a.forEach(x=>{ const k=key(x); m.set(k,(m.get(k)||0)+1); }); return m; };
  const cb=cnt(b), cl=cnt(l), cr=cnt(r); const bi=new Map(b.map(x=>[key(x),x])), ri=new Map(r.map(x=>[key(x),x]));
  const target=k=>{ if(k[0]==="#"){ const inL=cl.has(k), inR=cr.has(k), inB=cb.has(k); if(inL&&inR) return 1; if(inL) return (inB&&_j(bi.get(k))===_j(l.find(x=>key(x)===k)))?0:1; return (inB&&_j(bi.get(k))===_j(ri.get(k)))?0:1; }
    return Math.max(0,(cl.get(k)||0)+(cr.get(k)||0)-(cb.get(k)||0)); };

  const add=(x,fromR)=>{ const k=key(x); const u=used.get(k)||0; if(u>=target(k)) return; used.set(k,u+1);
    out.push(k[0]==="#"&&!fromR&&ri.has(k)?merge3(bi.get(k),x,ri.get(k)):x); };
  l.forEach(x=>add(x,false)); r.forEach(x=>add(x,true));
  return out;
}

function applyMark(s,result,q){

  s.events=s.events||[]; s.events.push({date:todayISO(),type:"part",delta:m[0],label:"پرسیاری قرعە: "+m[1],via:"call"});

  ensureActive(); amtApplySubjects(); if(!amtViewOk(S.view)) S.view="room";
  try{ const pf=S.profile||{}, tg=document.querySelector(".tagline"); if(tg&&(pf.school||pf.name)) tg.textContent=[pf.school,pf.name,(S.subjDefs||[]).map(d=>d.name).join(" · ")].filter(Boolean).join(" · "); }catch(e){}
  amtNavExtras(); renderStageBar(); renderClassBar(); renderNav(); renderMain();
}

function renderStageBar(){
  const bar=$("#stageBar");
  bar.innerHTML='<span class="lbl">پۆل:</span>';
  const all=[...new Set(STAGES.concat(Object.keys(S.stages||{})))].sort((a,b)=>(+a)-(+b));
  let shown=all.filter(amtStageUsed); if(!shown.length) shown=STAGES.slice();
  shown.forEach(g=>{
    const b=document.createElement("button");
    b.className="ctab"+(S.stage===g?" on":"");
    b.innerHTML=`پۆلی ${g} <span class="cnt">${stageCount(g)}</span>`;
    b.onclick=()=>{S.stage=g; attMode=false; planSel=null; render(); save();};
    bar.appendChild(b);
  });
}

/* ===== AMT: تەنها ئەو پۆلانە کە بەکاریان دەهێنیت (قوتابی تێدایە، یان لە پرۆفایل هەڵبژێردراون، یان ئێستا کراوەیە) ===== */
function amtStageUsed(g){ g=String(g); if(g===S.stage) return true; if(stageCount(g)>0) return true; return (S.amtGrades||[]).map(String).includes(g); }
function renderClassBar(){
  const bar=$("#classBar");
  bar.innerHTML='<span class="lbl">بەش:</span>';
  const st=ST();
  st.sections.forEach(c=>{
    const b=document.createElement("button");
    b.className="ctab"+(S.active===c?" on":"");
    const sj=subjOf(S.stage,c); b.innerHTML=`بەشی ${c}${sj.key==="hr"?` <span style="font-size:11.5px;opacity:.85">⚖️ ماف و جینۆساید</span>`:""} <span class="cnt">${(st.classes[c]||[]).length}</span>`;
    b.onclick=()=>{S.active=c; attMode=false; planSel=null; render(); save();};

  const add=document.createElement("button");
  add.className="ctab"; add.style.borderStyle="dashed"; add.title="زیادکردنی بەشی نوێ"; add.innerHTML="＋ بەش";

const VIEWS=[["room","ژووری دەرس"],["board","ڕیزبەندی"],["groups","گروپەکان"],["lessons","وانە و کەرەستە"],["grades","تۆماری نمرە"],["report","ڕاپۆرت"],["calendar","تەقویم"],["plan","پلانی وەرز"],["method","ڕێبازی فێرکاری"],["setup","ڕێکخستن و ناوەکان"],["live","📡 ڕاستەوخۆ"]];
/* ===== AMT: ئاستەکانی بەکارهێنان — تەنها بەشەکانی نیشاندان دەگۆڕێت، هیچ داتایەک ناسڕێتەوە ===== */
const AMT_LV={
  basic:{n:"سادە",v:["room","board","grades","setup"]},
  mid:{n:"ناوەند",v:["room","board","groups","grades","report","calendar","setup"]},
  high:{n:"ناوەندی باڵا",v:["room","board","groups","lessons","grades","report","calendar","plan","setup"]},
  pro:{n:"پێشکەوتوو",v:null}
};
function amtViewOk(k){ if(AMT_VIEWS[k]) return true; const L=AMT_LV[S.amtLevel]||AMT_LV.pro; return !L.v||L.v.includes(k); }
function amtSetLevel(lv){ if(!AMT_LV[lv]) return; S.amtLevel=lv; if(!amtViewOk(S.view)) S.view="room"; save(); render(); toast("ئاست: "+AMT_LV[lv].n); }
function amtNavExtras(){
  const box=$("#amtTop"); if(!box) return;
  box.innerHTML=`<select id="amtLvSel" class="dev-btn" title="ئاستی بەکارهێنان" style="padding:4px 6px">${Object.entries(AMT_LV).map(([k,o])=>`<option value="${k}" ${S.amtLevel===k?"selected":""}>${o.n}</option>`).join("")}</select>
    <button class="dev-btn" id="amtBreakBtn" title="پشووی مێشک — بێ ئینتەرنێت">🧠</button>
    <button class="dev-btn" id="amtProfBtn" title="پرۆفایل">👤</button>
    ${AMT_BTNS.map((b,i)=>`<button class="dev-btn" data-amtbtn="${i}" title="${esc(b.title||b.label)}">${esc(b.label)}</button>`).join("")}`;
  $("#amtLvSel").onchange=e=>amtSetLevel(e.target.value);
  $("#amtBreakBtn").onclick=()=>amtBreak(); $("#amtProfBtn").onclick=()=>amtEditProfile();
  box.querySelectorAll("[data-amtbtn]").forEach(b=>b.onclick=()=>{ try{ AMT_BTNS[+b.dataset.amtbtn].fn(); }catch(e){ toast("⚠️ "+e.message); } });
}
function renderNav(){
  const n=$("#nav"); n.innerHTML="";
  VIEWS.concat(Object.entries(AMT_VIEWS).map(([k,v])=>[k,v.label])).filter(([k])=>amtViewOk(k)).forEach(([k,lbl])=>{
    const b=document.createElement("button");
    b.className="nbtn"+(S.view===k?" on":"");
    b.textContent=lbl; b.onclick=()=>{S.view=k; render(); save();};
    n.appendChild(b);
  });
}

function renderMain(){
  const m=$("#main");
  LIVE.panel=(S.view==="live");
  if(S.view==="live"){ m.innerHTML=viewLive(); renderLivePanel(); kickPoll(50); return; }
  if(AMT_VIEWS[S.view]){ try{ m.innerHTML=AMT_VIEWS[S.view].fn()||""; if(AMT_VIEWS[S.view].after) AMT_VIEWS[S.view].after(); }catch(e){ m.innerHTML=`<div class="panel">⚠️ هەڵە لە زیادکراو: ${esc(e.message)}</div>`; } return; }
  if(S.view==="room") m.innerHTML=viewRoom();
  else if(S.view==="board") m.innerHTML=viewBoard();
  else if(S.view==="groups") m.innerHTML=viewGroups();
  else if(S.view==="grades") m.innerHTML=viewGrades();
  else if(S.view==="lessons") m.innerHTML=viewLessons();
  else if(S.view==="report") m.innerHTML=viewReport();
  else if(S.view==="calendar") m.innerHTML=viewCalendar();
  else if(S.view==="plan") m.innerHTML=viewPlan();
  else if(S.view==="method") m.innerHTML=viewMethod();
  else if(S.view==="setup") m.innerHTML=viewSetup();
  bind();
}

  </div>`;
  S.callLesson=curLesson();
  bar += curLessonStrip() + (list.length?attForLesson(list):"") + hwBanner();

  if(!list.length){
    return bar+`<div class="empty"><div class="ic">🏛️</div>
      <p>هێشتا ناوی قوتابی بۆ <b>بەشی ${S.active}</b> زیاد نەکراوە.</p>
      <p>بڕۆ بۆ بەشی <b>ڕێکخستن و ناوەکان</b> و لیستی قوتابیان زیاد بکە.</p>
      <button class="btn btn-pri" id="goSetup" style="margin-top:12px">زیادکردنی ناوەکان</button></div>`;
  }

    const lvlClass = {l:"lvl-l",n:"lvl-n",b:"lvl-b",z:"lvl-z"}[s.level||"n"];
    const lvlTxt = (LEVELS.find(L=>L[1]===(s.level||"n"))||["ناوەند"])[0];

    let attRow = `<div class="att-row">
      <button class="att-btn ${att==="present"?"on-p":""}" data-att="present" data-id="${s.id}">✓ ئامادە</button>
      <button class="att-btn ${att==="late"?"on-l":""}" data-att="late" data-id="${s.id}">دواکەوتوو</button>
      <button class="att-btn ${att==="absent"?"on-a":""}" data-att="absent" data-id="${s.id}">نەهاتوو</button>
      <button class="att-btn ${att==="leave"?"on-m":""}" data-att="leave" data-id="${s.id}" title="مۆڵەتی هەیە — غیابی بە ئیزن (نمرەی ئامادەبوون کەم ناکاتەوە)">مۆڵەت</button>
      <button class="att-btn ${att==="yard"?"on-y":""}" data-att="yard" data-id="${s.id}" title="هاتووەتە قوتابخانە بەڵام نەهاتە ژوورەوە — لە ساحەیە">لە ساحە</button>
      <button class="att-btn ${att==="out"?"on-o":""}" data-att="out" data-id="${s.id}">دەرەوە</button>
      ${att?`<button class="att-btn" data-att="" data-id="${s.id}" title="هەڵوەشاندنەوەی غیابی ئەمڕۆ — ناوەکە سپی دەبێتەوە">↺ هەڵوەشاندنەوە</button>`:""}
    </div>
    ${(att&&att!=="present")?`<input class="reason-in" data-reason="${s.id}" placeholder="هۆکار (ئیختیاری)…" value="${esc(note)}">`:""}`;

    let body;
    if(away){
      body = `<div class="absent-note">${att==="out"?"⊘ کراوەتە دەرەوە — تۆمارکرا":att==="leave"?"📄 مۆڵەتی هەیە — غیابی بە ئیزن تۆمارکرا":att==="yard"?"🏫 لە قوتابخانەیە بەڵام نەهاتە پۆل (لە ساحەیە) — تۆمارکرا":"✗ ئەمڕۆ ئامادە نییە — تۆمارکرا"}</div>`;
    } else {
      body = `<div class="acts">
        <button class="act gp" data-ev="part" data-d="2" data-id="${s.id}">✓ راست <span class="d">+٢</span></button>
        <button class="act gp" data-ev="part" data-d="1" data-id="${s.id}">◐ ناوەند <span class="d">+١</span></button>
        <button class="act bn" data-ev="part" data-d="-1" data-id="${s.id}">✗ هەڵە <span class="d">−١</span></button>
        <button class="act bp" data-ev="beh" data-d="1" data-id="${s.id}">هەڵسوکەوتی جوان <span class="d">+١</span></button>
        <button class="act bn" data-behbad="${s.id}">هەڵسوکەوتی نەشیاو <span class="d">−١</span></button>

        <button class="act bp" data-snote="${s.id}">🗒️ سەرنج${(s.events||[]).some(e=>e.type==="note"&&e.date===todayISO())?" ✓":""}</button>

    return `<div class="card">
      <div class="top">
        <div style="display:flex;align-items:center;gap:9px;min-width:0">
          <div class="avatar sm">${s.photo?`<img src="${s.photo}">`:`<span class="ava-ph">${esc((s.name||"؟").trim()[0]||"؟")}</span>`}</div>

        <div class="chip"><div class="n">${attCount(s,"present")+attCount(s,"late")}</div><div class="t">ئامادەبوون</div></div>
      </div>
      ${""}
      ${body}

  }).join("");

  let hint = attMode
    ? `<p class="sub">دۆخی غیاب چالاکە — ئامادەبوونی هەر قوتابیەک دیاری بکە. ئەوانەی <b>دواکەوتوو</b>ن لە تۆمار نیشان دەکرێن.</p>`
    : `<p class="sub">لە کاتی دەرسدا بە کرتەیەک نمرەی بەشداری و هەڵسوکەوت تۆمار بکە. کرتە لەسەر ناوی قوتابی بکە بۆ کردنەوەی داشبۆردەکەی.</p>`;

  return bar + `<h2 class="sec">ژووری دەرس — پۆلی ${S.stage} بەشی ${S.active}</h2>` + hint + `<div class="grid">${cards}</div>`;
}

function viewBoard(){
  const list=[...curList()].sort((a,b)=>totalScore(b)-totalScore(a));
  if(!list.length) return emptyClass();
  let rows=list.map((s,i)=>{
    const rc = i===0?"g1":i===1?"g2":i===2?"g3":"";

    return `<div class="lb-row">
      <div class="rank ${rc}">${i+1}</div>
      <div class="lb-name" data-open="${s.id}">${esc(s.name)} ${badge}</div>
      <div class="lb-score">${fmt(totalScore(s))}</div>
    </div>`;
  }).join("");
  return `<h2 class="sec">ڕیزبەندی پۆلی ${S.stage} بەشی ${S.active}</h2>
    <p class="sub">قوتابیان بەپێی کۆی نمرەی بەشداری و هەڵسوکەوت. سەرترین قوتابی دەبێتە «${SUBJ().star}».</p>
    <div class="lb">${rows}</div>`;
}

/* ---------- GRADE SHEET (official format) ---------- */
function gcell(s,term,field,max,auto){
  const m=sm(s,term); const v=m[field];
  if((field==="mk1"||field==="mk2")&&glOf(term+(field==="mk1"?"h1":"h2"))){ const lv=m[field==="mk1"?"lk1":"lk2"];
    return `<td title="جێگیر کراوە — ناگۆڕێت"><span class="ginwrap"><input class="gin" type="text" value="${lv==null?(auto==null?"":fmtN(auto)):fmtN(lv)}" disabled style="background:#f3efe4;color:#5a4a1e;font-weight:700"> 🔒</span></td>`; }
  const ph = auto!=null ? `placeholder="${fmtN(auto)}"` : `placeholder="${(field==="mk1"||field==="mk2")?"—":"0"}"`;
  const isAuto=(field==="mk1"||field==="mk2");
  const cls = isAuto && v==null ? "gin auto" : "gin";
  return `<td><span class="ginwrap"><input class="${cls}" type="text" inputmode="decimal" data-sid="${s.id}" data-term="${term}" data-field="${field}" data-max="${max}" value="${v==null?"":v}" ${ph}><span class="ginbtns"><button type="button" class="gstep" data-step="1" data-tsid="${s.id}" data-tterm="${term}" data-tfield="${field}" data-tmax="${max}">▲</button><button type="button" class="gstep" data-step="-1" data-tsid="${s.id}" data-tterm="${term}" data-tfield="${field}" data-tmax="${max}">▼</button></span></span></td>`;
}

function updateGradeRow(sid){
  const s=findStu(sid); if(!s) return;
  const r=computeStudent(s);
  const set=(id,val,fail)=>{ const el=document.getElementById(id); if(el){ el.textContent=val; if(fail!=null){ el.className= fail?"gfail":""; } } };
  set("g-t1-"+sid, fmtN(r.t1.total), r.t1fail);
  set("g-t2-"+sid, fmtN(r.t2.total), r.t2fail);
  set("g-round-"+sid, fmtN(r.round));
  set("g-q1-"+sid, r.q1==null?"—":fmtN(r.q1));
  set("g-q2-"+sid, r.q2==null?"—":fmtN(r.q2));
  set("g-final-"+sid, r.finalv==null?"—":fmtN(r.finalv), (r.finalv!=null && r.finalv<PASS));
  const st=document.getElementById("g-status-"+sid);
  if(st){ st.textContent=r.status; st.className=r.pass?"gpass":"gfail"; }

}
function gradeColDefs(){
  return [
    {v:o=>o.r.t1.c1,max:10},{v:o=>num(sm(o.s,"t1").e20),max:20},{v:o=>o.r.t1.c2,max:10},{v:o=>num(sm(o.s,"t1").e60),max:60},{v:o=>o.r.t1.total,max:100},
    {v:o=>o.r.t2.c1,max:10},{v:o=>num(sm(o.s,"t2").e20),max:20},{v:o=>o.r.t2.c2,max:10},{v:o=>num(sm(o.s,"t2").e60),max:60},{v:o=>o.r.t2.total,max:100},
    {v:o=>o.r.round,max:100},
    null,null,null,null,
    {v:o=>o.r.finalv,max:100}
  ];
}
function gradeFootCells(which){
  const list=curList(); const R=list.map(s=>({s,r:computeStudent(s)})); const N=list.length||1;
  return gradeColDefs().map((c,idx)=>{
    if(!c) return `<td id="gf-${which}-${idx}">—</td>`;
    let pass=0; R.forEach(o=>{const v=c.v(o); if(v!=null && v>=c.max/2) pass++;});
    const val = which==="n"?N : which==="pass"?pass : which==="rate"?(Math.round(pass/N*100)+"٪") : (N-pass);
    const cls = (which==="fail" && (N-pass)>0) ? "gfail" : (which==="pass" ? "gpass" : "");
    return `<td id="gf-${which}-${idx}" class="${cls}">${val}</td>`;
  }).join("");
}
function updateGradeFooter(){
  const list=curList(); const R=list.map(s=>({s,r:computeStudent(s)})); const N=list.length||1;
  gradeColDefs().forEach((c,idx)=>{
    if(!c) return;
    let pass=0; R.forEach(o=>{const v=c.v(o); if(v!=null && v>=c.max/2) pass++;});
    const set=(w,val,red,green)=>{const el=document.getElementById("gf-"+w+"-"+idx); if(el){el.textContent=val; el.classList.toggle("gfail",!!red); el.classList.toggle("gpass",!!green);} };
    set("n",N); set("pass",pass,false,true); set("rate",Math.round(pass/N*100)+"٪"); set("fail",N-pass,(N-pass)>0);
  });
}

const PERIODS=[["week","هەفتانە"],["month","مانگانە"],["season","وەرزانە"],["year","کۆی ساڵ"]];
function inPeriod(d,p){
  if(p==="year") return true;
  if(p==="month") return d.startsWith(monthISO());
  const diff=(new Date(todayISO()) - new Date(d))/86400000;
  if(p==="week") return diff>=0 && diff<7;
  if(p==="season") return diff>=0 && diff<90;
  return true;
}

/* پلان دەخاتە ناو وانەکان؛ ئەو وانانەی مامۆستا خۆی دەستکاری کردوون (userEdited) دەستیان لێ نادرێت */
function applyPlanTo(T,P){
  (P.lessons||[]).forEach(L=>{
    const o=T[L.n]=T[L.n]||{title:"",notes:"",mats:[]};
    o.mats=o.mats||[];
    if(o.userEdited){ if(!o.methods||!o.methods.length) o.methods=L.m.slice(); return; }
    o.title=L.t; o.bookFrom=L.p?String(L.p[0]):""; o.bookTo=L.p?String(L.p[1]):"";
    o.topics=(L.tp||[]).map(t=>({t,n:""})); o.notes=planNotes(L,P); o.methods=L.m.slice(); o.guide=L.g; o.week=L.w;
    o.questions=o.questions||[]; o.homework=o.homework||"";
    delete o.pack; delete o.packV; o.slides=(o.slides||[]).filter(s=>s.own);
  });
  Object.keys(T).forEach(k=>{ if(+k>(P.lessons||[]).length && !T[k].userEdited && !(T[k].mats||[]).length) delete T[k]; });
}

function ytId(u){ const m=String(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/))([\w-]{6,})/); return m?m[1]:(/^[\w-]{11}$/.test(u||"")?u:null); }
function parseSubs(txt){ // هەر دێڕێک: 0:05 دەق   یان   1:02:10 دەق
  if(Array.isArray(txt)) return txt;
  return String(txt||"").split("\n").map(l=>{ const m=l.trim().match(/^\(?(\d{1,2}(?::\d{1,2}){1,2})\)?\s*[-–:]?\s*(.+)$/); if(!m) return null;
    const p=normDigits(m[1]).split(":").map(Number); const s=p.reduce((a,b)=>a*60+b,0); return [s,m[2].trim()]; }).filter(Boolean).sort((a,b)=>a[0]-b[0]);
}
function subsToText(a){ return (a||[]).map(([s,t])=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")+" "+t).join("\n"); }

function normName(s){ return String(s||"").replace(/ه‌/g,"ە").replace(/‌/g,"").replace(/ك/g,"ک").replace(/[يى]/g,"ی").replace(/[أإآ]/g,"ا").replace(/\s+/g," ").trim(); }
const SHEET_SEC={"أ":"A","ا":"A","ئ":"A","ب":"B","ج":"C","د":"D","ه":"E","هـ":"E","و":"F","A":"A","B":"B","C":"C","D":"D","E":"E","F":"F"};

  const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=()=>res(window.JSZip); s.onerror=()=>{JSZIPP=null; rej(new Error("jszip"));}; document.head.appendChild(s); }); return JSZIPP; }
function hasV(v){ return v!=null && String(v).trim()!==""; }
function r05(x){ return Math.round(Number(x)*2)/2; }
function schoolRowValues(s){
  const r=computeStudent(s), m1=sm(s,"t1"), m2=sm(s,"t2");
  const done1=hasV(m1.e20)&&hasV(m1.e60), done2=hasV(m2.e20)&&hasV(m2.e60);
  const W=gwindows(), td=todayISO(), on=w=>td>=w.from;
  const v={E:(on(W.a1)&&r.t1.c1!=null)?r05(r.t1.c1):null, F:hasV(m1.e20)?r05(m1.e20):null, G:(on(W.a2)&&td>W.a2.from&&r.t1.c2!=null)?r05(r.t1.c2):null, H:hasV(m1.e60)?r05(m1.e60):null, I:done1?r05(r.t1.total):null,
           J:(td>W.b1.from&&r.t2.c1!=null)?r05(r.t2.c1):null, K:hasV(m2.e20)?r05(m2.e20):null, L:(td>W.b2.from&&r.t2.c2!=null)?r05(r.t2.c2):null, M:hasV(m2.e60)?r05(m2.e60):null, N:done2?r05(r.t2.total):null,
           O:(done1&&done2)?r.round:null,
           P:hasV(m1.mu)?r05(m1.mu):null, Q:r.q1!=null?r05(r.q1):null, R:hasV(m2.mu)?r05(m2.mu):null, S:r.q2!=null?r05(r.q2):null,
           T:(done1&&done2&&r.finalv!=null)?r.finalv:null};
  return v;
}
function setCell(xml,ref,val){
  const re=new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');
  const m=xml.match(re); if(!m) return xml;
  const sAttr=(m[1].match(/\ss="\d+"/)||[""])[0];
  if(/<f>/.test(m[2]||"")) return xml;                      // فۆرمولا دەستکاری ناکرێت
  const cell= val==null ? `<c r="${ref}"${sAttr}/>` : `<c r="${ref}"${sAttr}><v>${val}</v></c>`;
  return xml.replace(m[0],cell);
}
async function exportSchoolGrades(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    let JSZip; try{ JSZip=await loadJSZip(); }catch(e){ toast("پێویستی بە ئینتەرنێتە بۆ ئەم کارە"); return; }
    try{
      const zip=await JSZip.loadAsync(f);
      const wb=await zip.file("xl/workbook.xml").async("string");
      const rels=await zip.file("xl/_rels/workbook.xml.rels").async("string");
      const ssf=zip.file("xl/sharedStrings.xml"); const ssx=ssf?await ssf.async("string"):"";
      const shared=[...ssx.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(""));
      const st=ST(); const report=[]; let total=0;
      for(const sm_ of wb.matchAll(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)){
        const name=sm_[1].trim(), rid=sm_[2]; const sec=SHEET_SEC[name]; if(!sec||!st.classes[sec]) { report.push(`⏭️ پەڕەی «${name}»: بەشی هاوتا نییە`); continue; }
        const tgt=(rels.match(new RegExp('Id="'+rid+'"[^>]*Target="([^"]+)"'))||rels.match(new RegExp('Target="([^"]+)"[^>]*Id="'+rid+'"'))||[])[1]; if(!tgt) continue;
        const path="xl/"+tgt.replace(/^\/?xl\//,""); let xml=await zip.file(path).async("string");
        const studs=st.classes[sec]; const byName={}; studs.forEach(s=>byName[normName(s.name)]=s);
        const used=new Set(); let matched=0; const miss=[];
        for(const c of xml.matchAll(/<c r="D(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
          const row=+c[1]; if(row<7) continue; const inner=c[3]||""; let nm="";
          if(/t="s"/.test(c[2])){ const v=inner.match(/<v>(\d+)<\/v>/); if(v) nm=shared[+v[1]]||""; }
          else { const t=inner.match(/<t[^>]*>([\s\S]*?)<\/t>/); if(t) nm=t[1]; }
          nm=normName(nm.replace(/&amp;/g,"&")); if(!nm) continue;
          let s=byName[nm]; if(!s){ const k3=nm.split(" ").slice(0,3).join(" "); s=studs.find(x=>!used.has(x.id)&&normName(x.name).startsWith(k3)); }
          if(!s){ miss.push(nm); continue; }
          used.add(s.id); matched++;
          const v=schoolRowValues(s); for(const col in v) xml=setCell(xml,col+row,v[col]);
        }
        zip.file(path,xml); total+=matched;

        <div class="hint">✍️ ئەم نمرەیە بە دەست لەسەر وەرەقەکە بنووسە. ڕاستکردنەوەی ڕستە هەڵەکان (ئەگەر نمرەی هەبێت) بە چاو بپشکنە.<br>🟢 ڕاست · 🔴 وەڵامی قوتابی (هەڵە) · 🔵 وەڵامی ڕاست · ○ بێ وەڵام · ⚠️ زیاتر لە یەک بازنە</div>
        <div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-pri" id="scNext">📸 وەرەقەی دواتر</button></div></div>`;
      $("#scNext").onclick=()=>{ SCAN.done.unshift("فۆرم "+(res.P.sid||"—")+" — "+fmtN(gr.score)+"/"+res.P.max); drawList(); again(); };
      return; }
    const s=findStu(res.P.sid);
    $("#scOut").innerHTML=`<div class="sc-res"><div class="sc-name">${s?esc(s.name):"⚠️ ئەم قوتابییە لەم ئامێرەدا نییە"}</div>
      <div class="sc-score"><input type="number" id="scEdit" value="${gr.score}" min="0" max="${res.P.max}" step="0.5" style="width:110px;font-size:34px;font-weight:800;color:#1F4E79;text-align:center"> <span>/ ${kuNum(res.P.max)}</span></div><div class="hint" style="margin:0">✏️ دەتوانیت نمرەکە بگۆڕیت پێش تۆمارکردن</div><div>${kuNum(gr.ok)} ڕاست لە ${kuNum(gr.n)} · ${XKIND[res.P.kind]||""}</div>
      <div class="sc-each">${gr.each.map((e,i)=>`<span class="${e.good?"ok":"no"}">${kuNum(i+1)} ${sym(e)}</span>`).join("")}</div>
      <div class="hint">🟢 ڕاست · 🔴 وەڵامی قوتابی (هەڵە) · 🔵 وەڵامی ڕاست · ○ بێ وەڵام · ⚠️ زیاتر لە یەک بازنە</div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-pri" id="scSave">✅ تۆمارکردن</button><button class="btn btn-gh btn-sm" id="scAgain">↻ دووبارە</button></div></div>`;
    $("#scAgain").onclick=again;
    $("#scSave").onclick=()=>{ const ev=String(normDigits($("#scEdit").value)).trim(); if(ev!==""&&!isNaN(+ev)) gr=Object.assign({},gr,{score:Math.max(0,Math.min(res.P.max,+ev))}); const ok=saveScan(res.P,gr); SCAN.done.unshift((s?s.name:"؟")+" — "+fmtN(gr.score)+"/"+res.P.max); toast(ok?"تۆمارکرا ✓":"ئەنجام پاشەکەوت کرا، بەڵام قوتابییەکە لەم ئامێرەدا نییە"); drawList(); again(); if(typeof renderMain==="function") try{renderMain();}catch(e){} };
  };
  const again=()=>{ $("#scOut").innerHTML=""; can.style.display="none"; if(SCAN.stream) vid.style.display=""; };
  const drawList=()=>{ $("#scList").innerHTML=SCAN.done.length?`<b>ئەمڕۆ سکانکراون (${kuNum(SCAN.done.length)}):</b><br>`+SCAN.done.map(esc).join("<br>"):""; };
  $("#scShot").onclick=()=>{ if(!SCAN.stream||!vid.videoWidth){ toast("کامێرا ئامادە نییە"); return; } can.width=vid.videoWidth; can.height=vid.videoHeight; can.getContext("2d").drawImage(vid,0,0); process(); };
  $("#scFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const im=new Image(); im.onload=()=>{ can.width=im.naturalWidth; can.height=im.naturalHeight; can.getContext("2d").drawImage(im,0,0); URL.revokeObjectURL(im.src); process(); }; im.src=URL.createObjectURL(f); e.target.value=""; };
  $("#scBatch").onchange=e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length) scanBatch(fs,{vid,can}); };
  drawList();
}

/* ===== 📄 سکانی کۆمەڵ: PDF ـی سکانەر یان چەند وێنەیەک (تا ١٠٠ لاپەڕە) ===== */
const BATCH_MAX=100;
function fileToImage(f){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext("2d").drawImage(im,0,0); URL.revokeObjectURL(im.src); res(c); }; im.onerror=()=>{ URL.revokeObjectURL(im.src); rej(new Error("img")); }; im.src=URL.createObjectURL(f); }); }
async function batchPages(files,onPage){
  let n=0;
  for(const f of files){
    if(n>=BATCH_MAX) break;
    if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){
      await loadLib("pdfjsLib"); pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
      const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let i=1;i<=doc.numPages&&n<BATCH_MAX;i++){
        const pg=await doc.getPage(i); const v1=pg.getViewport({scale:1}); const sc=Math.min(4,2200/Math.max(v1.width,v1.height));
        const vp=pg.getViewport({scale:sc}); const c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
        const cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height);
        await pg.render({canvasContext:cx,viewport:vp}).promise; pg.cleanup();
        n++; await onPage(c,f.name+" · لاپەڕە "+kuNum(i));
      }
      doc.destroy();
    } else if(/^image\//.test(f.type)){ const c=await fileToImage(f); n++; await onPage(c,f.name); }
  }
  return n;
}
function thumbOf(c){ const k=Math.min(1,900/c.width); const t=document.createElement("canvas"); t.width=Math.round(c.width*k); t.height=Math.round(c.height*k); t.getContext("2d").drawImage(c,0,0,t.width,t.height); return t.toDataURL("image/jpeg",0.6); }
async function scanBatch(files,ui){
  stopScanCam(); if(ui.vid) ui.vid.style.display="none"; if(ui.can) ui.can.style.display="none";
  const out=$("#scOut"); const rows=[];
  out.innerHTML=`<div class="sb-prog">⏳ ئامادەکردن…</div>`;
  try{ await loadLib("jsQR"); }catch(e){ out.innerHTML=`<div class="sc-err">پێویستی بە ئینتەرنێتە.</div>`; return; }
  let total=0;
  try{
    total=await batchPages(files,async(c,label)=>{
      const pe=out.querySelector(".sb-prog"); if(pe) (pe.textContent="⏳ سەحکردنی لاپەڕەی "+kuNum(rows.length+1)+"…" );
      await new Promise(r=>setTimeout(r,0));
      let res; try{ res=omrAnalyze(c); }catch(er){ console.error(er); res={err:"هەڵەیەک ڕوویدا لە خوێندنەوەی ئەم لاپەڕەیە."}; }
      const row={label,res};
      if(!res.err){ row.gr=omrGrade(res); omrDraw(c,res,row.gr); row.s=res.P.kind==="w"?null:findStu(res.P.sid); row.multi=row.gr.each.some(e=>e.m===-2); row.blank=row.gr.each.filter(e=>e.m===-1).length; }
      row.img=thumbOf(c); rows.push(row);
    });
  }catch(er){ console.error(er); out.innerHTML=`<div class="sc-err">⚠️ فایلەکە نەخوێندرایەوە${/pdfjs/i.test(er.message||"")?" — بۆ PDF پێویستی بە ئینتەرنێتە":""}.</div>`; return; }
  if(!rows.length){ out.innerHTML=`<div class="sc-err">هیچ لاپەڕەیەک نەدۆزرایەوە.</div>`; return; }
  // دووبارە: هەمان قوتابی + هەمان تاقیکردنەوە
  const seen={}; rows.forEach((r,i)=>{ if(r.res.err||r.res.P.kind==="w") return; const k=r.res.P.id+"|"+r.res.P.sid; if(seen[k]!=null) rows[seen[k]].dup=true; seen[k]=i; });
  // نمرەی پێشووی هەمان تاقیکردنەوە ← بە بنەڕەت هەڵنابژێردرێت (تەنها ئەوانەی نمرەیان نییە)؛ ئەگەر هەڵبژێردرا، دەگۆڕدرێت نەک دووبارە
  const prevManual=(s,P)=>P.kind==="quiz"&&(s.events||[]).some(e=>e.type==="quizscore"&&e.examId===P.id&&/دەستی/.test(e.label||""));
  const prevScore=(s,P)=>{ if(P.kind==="quiz"){ const e=(s.events||[]).filter(e=>e.type==="quizscore"&&e.examId===P.id).pop(); return e?e.score:null; }
    const v=sm(s,P.term)[P.kind==="e80"?"mu":P.kind]; return (v===""||v==null)?null:v; };
  rows.forEach(r=>{ r.ok=!r.res.err&&r.res.P.kind!=="w"&&!!r.s; r.had=r.ok?prevScore(r.s,r.res.P):null; r.hadMan=r.ok&&r.had!=null&&prevManual(r.s,r.res.P); r.pick=r.ok&&!r.dup&&(r.had==null||r.hadMan); r.man=!!r.res.err; });
  // بۆ لاپەڕە نەخوێندراوەکان: لیستی قوتابیان (ئەوانەی هێشتا سکان نەکراون لە سەرەوە)
  const P0=(rows.find(r=>r.res.P&&r.res.P.kind!=="w")||{res:{}}).res.P; const EX=P0?examsList().find(e=>e.id===P0.id):null; const MAXM=P0?P0.max:((S.rubric&&S.rubric.quizOutOf)||10);
  const roster=(EX?studentsOf(EX.secs).map(o=>o.s):(ST().classes[S.active]||[])); const doneIds=new Set(rows.filter(r=>r.ok).map(r=>r.s.id));
  const opts=[...roster.filter(s=>!doneIds.has(s.id)),...roster.filter(s=>doneIds.has(s.id))].map(s=>`<option value="${s.id}">${esc(s.name)}${doneIds.has(s.id)?" ✓":""}</option>`).join("");
  rows.forEach(r=>{ if(r.man&&r.res.P&&findStu(r.res.P.sid)) r.s=findStu(r.res.P.sid); });
  const good=rows.filter(r=>r.pick).length, bad=rows.filter(r=>!r.pick&&r.had==null&&!r.dup).length;
  const st=r=>(r.hadMan&&!r.dup)?`<span class="sb-ok">✓ نمرەی دەستی ${fmtN(r.had)} ← دەگۆڕدرێت بەم نمرەیە</span>`:(r.had!=null&&!r.dup)?`<span class="sb-warn">پێشتر نمرەی هەیە: ${fmtN(r.had)} — نیشانەی بکە بۆ گۆڕین</span>`:r.res.err?`<span class="sb-bad">⚠️ ${esc(r.res.err)}</span>`:r.res.P.kind==="w"?`<span class="sb-warn">📄 نووسراو — بە دەست بنووسە</span>`:!r.s?`<span class="sb-bad">قوتابی لەم ئامێرەدا نییە</span>`:r.dup?`<span class="sb-warn">دووبارە — دوایینیان وەرگیرا</span>`:r.multi?`<span class="sb-warn">✓ (پرسیارێک ٢ بازنەی هەیە — 👁)</span>`:r.blank?`<span class="sb-ok">✓ (${kuNum(r.blank)} بێ وەڵام)</span>`:`<span class="sb-ok">✓</span>`;
  out.innerHTML=`<div class="sb-sum">${kuNum(rows.length)} لاپەڕە${total>=BATCH_MAX?" (زۆرترین "+kuNum(BATCH_MAX)+")":""} · <b class="sb-ok">${kuNum(good)} ئامادە</b>${rows.some(r=>r.had!=null&&!r.dup)?` · ${kuNum(rows.filter(r=>r.had!=null&&!r.dup).length)} پێشتر نمرەیان هەیە`:""}${bad?` · <b class="sb-bad">${kuNum(bad)} پێویستی بە پشکنین</b>`:""}</div>
    <div class="sb-tw"><table class="sb-t"><thead><tr><th></th><th>#</th><th>قوتابی</th><th>نمرە</th><th>دۆخ</th><th></th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.pick?"":"sb-dim"}"><td><input type="checkbox" data-sbi="${i}" ${r.pick?"checked":""} ${r.ok||r.man?"":"disabled"}></td><td>${kuNum(i+1)}</td>
      <td>${r.man?(r.s?esc(r.s.name):`<select data-sbs="${i}"><option value="">— قوتابی —</option>${opts}</select>`):r.s?esc(r.s.name):r.res.P.kind==="w"?"فۆرمی "+esc(r.res.P.sid||"—"):"؟"}</td>
      <td>${r.man?`<input type="number" data-sbn="${i}" min="0" max="${MAXM}" step="0.5" style="width:58px" placeholder="نمرە">/${kuNum(MAXM)}`:r.ok?`<input type="number" data-sbe="${i}" value="${r.gr.score}" min="0" max="${r.res.P.max}" step="0.5" style="width:58px;font-weight:700">/${kuNum(r.res.P.max)}`:r.gr?`<b>${fmtN(r.gr.score)}</b>/${kuNum(r.res.P.max)}`:"—"}</td><td>${st(r)}</td><td><button class="btn btn-gh btn-sm" data-sbv="${i}">👁</button></td></tr>`).join("")}
    </tbody></table></div>
    <div id="sbView"></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-pri" id="sbSave">✅ تۆمارکردنی هەڵبژێردراوەکان</button>${EX&&EX.kind==="quiz"?`<button class="btn btn-gh btn-sm" id="sbZero">0️⃣ سفر بۆ ئەوانەی وەرەقەیان نییە</button>`:""}${rows.some(r=>r.had!=null&&!r.dup)?`<button class="btn btn-gh btn-sm" id="sbAll">🔁 هەموویان (نمرە کۆنەکان بگۆڕە)</button>`:""}</div>
    <div class="hint">هەموو نمرەکان دەتوانیت بە دەست بگۆڕیت. لاپەڕەیەک نەخوێندرایەوە؟ بە 👁 سەیری بکە، ناو و نمرەکەی بنووسە. 🟢 ڕاست · 🔴 هەڵە · 🔵 وەڵامی ڕاست</div>`;
  const syncMan=i=>{ const r=rows[i]; const n=out.querySelector(`[data-sbn="${i}"]`), sel=out.querySelector(`[data-sbs="${i}"]`);
    if(sel) r.s=sel.value?findStu(sel.value):null; const v=n?String(normDigits(n.value)).trim():""; r.mscore=v===""?null:Math.max(0,Math.min(MAXM,+v));
    r.pick=!!(r.s&&r.mscore!=null&&!isNaN(r.mscore)); const cb=out.querySelector(`[data-sbi="${i}"]`); if(cb){ cb.checked=r.pick; cb.closest("tr").classList.toggle("sb-dim",!r.pick); } };
  // گۆڕینی نمرەی سکانکراو بە دەست ← خۆکار هەڵدەبژێردرێت
  out.querySelectorAll("[data-sbe]").forEach(el=>{ el.oninput=()=>{ const i=+el.dataset.sbe, r=rows[i]; const v=String(normDigits(el.value)).trim();
    r.edit=(v===""||isNaN(+v))?null:Math.max(0,Math.min(r.res.P.max,+v)); el.style.background=(r.edit!=null&&r.edit!==r.gr.score)?"#fff4d6":"";
    if(r.edit!=null){ r.pick=true; const cb=out.querySelector(`[data-sbi="${i}"]`); if(cb){ cb.checked=true; cb.closest("tr").classList.remove("sb-dim"); } } }; });
  out.querySelectorAll("[data-sbn],[data-sbs]").forEach(el=>{ const i=+(el.dataset.sbn||el.dataset.sbs); el.oninput=el.onchange=()=>syncMan(i); });
  out.querySelectorAll("[data-sbv]").forEach(b=>b.onclick=()=>{ const r=rows[+b.dataset.sbv];
    $("#sbView").innerHTML=`<div class="sb-view"><div><b>${esc(r.label)}</b>${r.gr?" — "+r.gr.each.map((e,i)=>kuNum(i+1)+(e.m===-1?"○":e.m===-2?"⚠️":e.good?"✓":"✗")).join(" "):""}</div><img src="${r.img}"></div>`;
    $("#sbView").scrollIntoView({behavior:"smooth",block:"nearest"}); });
  const sbZero=$("#sbZero"); if(sbZero) sbZero.onclick=()=>{
    const has=s=>(s.events||[]).some(e=>e.type==="quizscore"&&e.examId===EX.id);
    const inBatch=new Set(rows.filter(r=>r.s&&(r.pick||r.saved)).map(r=>r.s.id));
    const miss=roster.filter(s=>!has(s)&&!inBatch.has(s.id)); if(!miss.length){ toast("هەموو قوتابیان نمرەیان هەیە"); return; }
    if(!confirm("ئەم قوتابیانە وەرەقەیان نییە و سفر وەردەگرن لەم کویزەدا:\n\n"+miss.map(s=>"• "+s.name).join("\n")+"\n\nبەردەوام بم؟")) return;
    miss.forEach(s=>{ s.events=s.events||[]; s.events.push({date:EX.date||todayISO(),type:"quizscore",score:0,max:EX.max,examId:EX.id,label:"کویز (وەرەقەی نییە) 0/"+EX.max}); EX.results=EX.results||{}; EX.results[s.id]={score:0,manual:true,at:todayISO()}; SCAN.done.unshift(s.name+" — 0/"+EX.max); });
    save(); toast(kuNum(miss.length)+" قوتابی سفریان وەرگرت"); $("#scList").innerHTML=`<b>ئەمڕۆ سکانکراون (${kuNum(SCAN.done.length)}):</b><br>`+SCAN.done.map(esc).join("<br>"); if(typeof renderMain==="function") try{renderMain();}catch(e){} };
  const sbAll=$("#sbAll"); if(sbAll) sbAll.onclick=()=>{ rows.forEach((r,i)=>{ if(r.ok&&!r.dup&&!r.saved){ r.pick=true; const c=out.querySelector(`[data-sbi="${i}"]`); if(c){ c.checked=true; c.closest("tr").classList.remove("sb-dim"); } } }); };
  out.querySelectorAll("[data-sbi]").forEach(c=>c.onchange=()=>{ rows[+c.dataset.sbi].pick=c.checked; c.closest("tr").classList.toggle("sb-dim",!c.checked); });
  $("#sbSave").onclick=()=>{ const pick=rows.filter(r=>r.pick&&(r.ok||(r.man&&r.s&&r.mscore!=null))); if(!pick.length){ toast("هیچ شتێک هەڵنەبژێردراوە"); return; }
    pick.filter(r=>r.man).forEach(r=>{ const s=r.s, P=r.res.P, eid=P?P.id:(EX?EX.id:null), mx=P?P.max:MAXM;
      if(EX){ EX.results=EX.results||{}; EX.results[s.id]={score:r.mscore,manual:true,at:todayISO()}; }
      s.events=(s.events||[]).filter(e=>!(eid&&e.examId===eid)); s.events.push({date:todayISO(),type:"quizscore",score:r.mscore,max:mx,examId:eid||undefined,label:"کویز (دەستی) "+fmtN(r.mscore)+"/"+mx});
      SCAN.done.unshift(s.name+" — "+fmtN(r.mscore)+"/"+mx+" (دەستی)"); r.pick=false; r.saved=true; });
    save();
    pick.filter(r=>!r.man).forEach(r=>{ if(r.edit!=null&&r.edit!==r.gr.score) r.gr=Object.assign({},r.gr,{score:r.edit}); saveScan(r.res.P,r.gr); SCAN.done.unshift(r.s.name+" — "+fmtN(r.gr.score)+"/"+r.res.P.max); r.pick=false; r.saved=true; });
    toast(kuNum(pick.length)+" نمرە تۆمارکرا ✓");
    out.querySelectorAll("[data-sbi]").forEach(c=>{ const r=rows[+c.dataset.sbi]; if(r.saved){ c.checked=false; c.disabled=true; c.closest("tr").classList.add("sb-done"); c.closest("tr").querySelectorAll("input,select").forEach(x=>x.disabled=true); } });
    $("#scList").innerHTML=`<b>ئەمڕۆ سکانکراون (${kuNum(SCAN.done.length)}):</b><br>`+SCAN.done.map(esc).join("<br>");
    if(typeof renderMain==="function") try{renderMain();}catch(e){} };
}

/* ===== 📄 تاقیکردنەوەی نووسراو بە شێوازی قوتابخانە (فۆرمی A و B) + جۆرە نوێیەکان ===== */
const WQ_TYPES={

  match:{ku:"هەر چەمکێک لە ستوونی (أ) بە پێناسە گونجاوەکەی لە ستوونی (ب) ببەستەرەوە.",lbl:"هاوتاکردن (ستوونی أ و ب)"},
  order:{ku:"ئەم ڕووداوانە بەپێی ڕیزبەندیی کات ڕیز بکە (١ = کۆنترین).",lbl:"ڕیزبەندیی کات"},

function printWritten(opt){

`;

  const secs=(list,from,key)=>list.map((s,i)=>wqSectionHTML(s,from+i,key)+(i<list.length-1?'<div class="stars">********</div>':"")).join("");
  const scanBox=(set,f)=>{ const A=set.filter(s=>s.k==="mc"||s.k==="tf"); const mc=A.find(s=>s.k==="mc"), tf=A.find(s=>s.k==="tf");
    const toks=[]; A.forEach(s=>s.items.forEach(x=>toks.push(s.k==="tf"?{t:"tf",k:2,ans:x.p.ans}:{t:"mc",k:x.p.opts.length,ans:x.p.ans})));
    const tokS=toks.map(t=>t.t==="tf"?"t"+t.ans:"m"+t.k+t.ans).join(""); const nMC=mc?mc.items.length:0;
    const max=(mc?mc.ans*mc.mk:0)+(tf?tf.ans*tf.mk:0);
    const pay=["HSH1",exId,opt.forms>1?"ABCD"[f]:"","w",opt.term,max,0,obf(tokS,exId,1),nMC,mc?mc.mk:0,mc?mc.ans:0,tf?tf.mk:0,tf?tf.ans:0].join(";");
    return `<div class="wsc"><div class="wsc-i"><b>📌 وەڵامی پرسیارەکانی ${A.map((s,i)=>"("+kuNum(i+1)+")").join(" و ")} تەنها لەم خشتەیەدا بدەرەوە:</b> هەر ژمارەیەک بە پڕکردنەوەی <b>یەک بازنە</b> بە پێنووسی ڕەش یان شین · (ڕ) = ڕاست، (هـ) = هەڵە<br>چوارگۆشە ڕەشەکان و QR ـەکە مەشارەوە و لە دەرەوەی بازنەکان مەنووسە.</div>
      <div>${omrSVG(toks,wPer(toks.length))}</div><div>${qrSVG(pay,28)}</div></div>`; };
  const page=(set,f,key)=>{

  sets.forEach(set=>set.forEach(s=>{ s.ans=Math.min(s.ans,s.items.length); s.cnt=s.items.length; }));

}

function qType(q){ if(/^ڕاست یان هەڵە/.test(q)) return "tf"; if(/^بۆشایی/.test(q)) return "blank"; if(/^هەڵبژاردن/.test(q)||/\(أ\)/.test(q)) return "mc"; if(/بژمێرە/.test(q)) return "list"; if(/(بۆچی|ڕوون بکەرەوە|بە ڕای تۆ|پەیوەندیی|بەراورد)/.test(q)) return "long"; return "short"; }
const QT_LBL={short:"وەڵامی کورت",tf:"ڕاست یان هەڵە",mc:"هەڵبژاردن",blank:"بۆشایی",list:"بژمێرە",long:"ڕوونکردنەوە"};
function qlogList(){ const st=ST(); st.qlog=st.qlog||[]; return st.qlog; }
function qStats(term,n,q){
  const L=qlogList().filter(x=>x.term===term&&x.n===n&&x.q===q);
  const ok=L.filter(x=>x.r==="right").length, mid=L.filter(x=>x.r==="mid").length;
  return {asked:L.length, pct:L.length?Math.round((ok+mid*0.5)*100/L.length):null};
}
function bankRows(term,from,to,type){
  const rows=[];
  for(let n=from;n<=to;n++){
    const L=(LSN()[term]||{})[n]; if(!L) continue;
    (L.questions||[]).forEach((line,i)=>{ const p=splitQA(line); const t=qType(p.q); if(type!=="all"&&t!==type) return;
      rows.push({n,i,line,q:p.q,a:p.a,t,st:qStats(term,n,line)}); });
  }
  return rows;
}

/* ===== 🧹 سلایدی دووبارە =====
   هۆکار: هەر ئامێرێک (لاپتۆپ/مۆبایل) کە پاکێجی وانەی جێبەجێ دەکرد، سلایدەکانی بە ID ـی هەڕەمەکی دروست دەکرد؛
   هاوکاتکردن بەپێی ID تێکەڵیان دەکات، بۆیە هەمان سلاید دوو–سێ جار دەمایەوە.
   چارەسەر: (١) ID ـی جێگیر بۆ سلایدی پاکێج (لە هەموو ئامێرێک وەک یەکە)  (٢) سڕینەوەی دووبارە بەپێی ناوەڕۆک. */
function strHash(t){ let h=5381; t=String(t); for(let i=0;i<t.length;i++){ h=((h<<5)+h+t.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function pkSlideId(P,i,sl){ return "pk-"+(P&&P.n!=null?P.n:"x")+"-"+i+"-"+strHash([sl.title||"",sl.body||"",sl.img||"",sl.yt||""].join("¦")); }
function slideKey(sl){ return [sl.own?"o":"p",sl.title||"",sl.body||"",sl.img||"",sl.cap||"",sl.yt||"",sl.matId||""].map(x=>String(x).trim()).join("¦"); }
function dedupeSlides(les){
  if(!les||!Array.isArray(les.slides)||!les.slides.length) return 0;
  const seen=new Set(), out=[]; let pi=0;
  les.slides.forEach(sl=>{ if(!sl) return; const k=slideKey(sl); if(seen.has(k)) return; seen.add(k);
    if(!sl.own&&!String(sl.id||"").startsWith("pk-")) sl.id="pk-"+((les.pack&&les.pack.n)||"x")+"-"+pi+"-"+strHash(k);
    if(!sl.own) pi++; out.push(sl); });
  const rm=les.slides.length-out.length; les.slides=out; return rm;
}
function dedupeAllSlides(){ let rm=0;
  Object.values(S.stages||{}).forEach(st=>{ if(!st) return;
    [st.lessons,st.hr&&st.hr.lessons].forEach(LS=>{ if(!LS) return; Object.values(LS).forEach(T=>{ Object.values(T||{}).forEach(o=>{ rm+=dedupeSlides(o); }); }); });
    Object.values(st.sd||{}).forEach(sd=>{ const LS=sd&&sd.lessons; if(!LS) return; Object.values(LS).forEach(T=>{ Object.values(T||{}).forEach(o=>{ rm+=dedupeSlides(o); }); }); }); });
  return rm; }
function applyPackTo(les,P,force){
  if(!force && les.packV===P.v && les.pack) return les;
  les.pack=JSON.parse(JSON.stringify(Object.assign({},P,{imgs:undefined}))); les.packV=P.v;
  les.title=P.title; les.bookFrom=P.pages?String(P.pages[0]):""; les.bookTo=P.pages?String(P.pages[1]):"";
  les.methods=(P.methods||[]).slice();
  les.topics=(P.topics||[]).map(x=>({t:x.t,n:x.s}));
  les.questions=(P.questions||[]).slice();
  les.homework=P.hw||"";
  les.notes="🎯 ئامانجەکان:\n"+(P.goals||[]).map((g,i)=>(i+1)+". "+g).join("\n")+"\n\n💡 دەستپێک:\n"+(P.hook||"")+"\n\n🧭 چالاکی:\n"+((P.activity&&P.activity.steps)||[]).map((x,i)=>(i+1)+") "+x).join("\n")+"\n\n📝 تەختە:\n"+(P.board||"")+"\n\n🎫 بلیتی دەرچوون: "+(P.exit||"");
  const keep=(les.slides||[]).filter(s=>s.own);   // سلایدەکانی خۆت دەمێننەوە
  les.slides=(P.slides||[]).map((s,i)=>({id:pkSlideId(P,i,s),title:s.title,body:s.body||"",matId:"",dur:0,img:s.img||"",cap:s.cap||"",yt:s.yt||"",ytNote:s.ytNote||"",ytStart:s.ytStart||0,ytEnd:s.ytEnd||0,subs:s.subs||[]})).concat(keep);
  return les;
}

function qLevel(q){ const t=q.q;
  if(/^(ڕاست یان هەڵە|هەڵبژاردن|بۆشایی)/.test(t)) return 0;
  if(/بە ڕای تۆ|^باس لە|^جیاوازی|^ئایا|وەڵامی کراوە/.test(t+" "+q.a)) return 3;
  if(/بۆچی|ڕوون بکەرەوە|^هۆی|چۆن/.test(t)) return 2;
  if(/بژمێرە/.test(t)) return 1;
  return 1; }
function kwSet(s){ return new Set(String(s||"").replace(/[^؀-ۿ\w ]/g," ").split(/\s+/).filter(w=>w.length>=4)); }
function mplanData(n,mk){
  const pk=LES(S.lessonTerm||"t1",n).pack; if(!pk) return null;
  const kit=MKIT[mk]||MKIT.socratic, M=METHODS[mk]||{};
  const qs=(pk.questions||[]).map(splitQA).map(q=>Object.assign(q,{lv:qLevel(q)})).filter(q=>q.lv>0);
  const used=new Set(); const tps=(pk.topics||[]).slice(0,4);
  const rounds=tps.map(t=>{ const kw=kwSet(t.t+" "+t.s);
    const sc=q=>{ let c=0; kwSet(q.q+" "+q.a).forEach(w=>{ if(kw.has(w)) c++; }); return c; };
    const pick=(lv,k)=>qs.filter(q=>q.lv===lv&&!used.has(q.q)).map(q=>[sc(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,k).filter(x=>x[0]>0).map(x=>{used.add(x[1].q); return x[1];});
    const ex=String(t.s||"").split("\n").filter(l=>/^•/.test(l.trim())).slice(0,3).map(l=>l.replace(/^•\s*/,"").trim());
    return {t:t.t,ex,l1:pick(1,1),l2:pick(2,2),l3:pick(3,1)}; });
  const mins=MPL.mins, beg=MPL.beg;
  const fixed={recap:3,intro:beg?5:0,hook:2,close:4,exit:3};
  const rem=Math.max(10,mins-Object.values(fixed).reduce((a,b)=>a+b,0)); const per=Math.max(4,Math.floor(rem/Math.max(1,rounds.length)));
  let t0=0; const tl=[]; const add=(d,lbl)=>{ tl.push([t0,t0+d,lbl]); t0+=d; };
  add(fixed.recap,"بیرهێنانەوەی وانەی پێشوو"); if(beg) add(fixed.intro,"فێربوونی شێوازەکە: "+(M.ku||"")); add(fixed.hook,"دەستپێک");
  rounds.forEach((r,i)=>add(per,"خولی "+kuNum(i+1)+": "+r.t)); add(fixed.close,"کۆکردنەوە و پوختەی تەختە"); add(fixed.exit,"بلیتی دەرچوون و ئەرکی ماڵەوە");
  return {pk,kit,M,mk,rounds,tl,beg,n};
}

function importPackFile(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text());
      const list=Array.isArray(d)?d:(d.packs||[d]);
      const stage=d.stage||S.stage, subj=d.subject||SUBJ().key, term=d.term||S.lessonTerm||"t1";
      S.packsExtra=S.packsExtra||{}; const a=S.packsExtra[stage]=S.packsExtra[stage]||{}; const b=a[subj]=a[subj]||{}; const c=b[term]=b[term]||{};
      let k=0; list.forEach(P=>{ if(P&&P.n&&P.title&&P.topics){ c[P.n]=P; k++; } });
      if(stage===S.stage && term===(S.lessonTerm||"t1")) list.forEach(P=>{ if(P&&P.n&&P.topics) applyPack(P.n,P,true); });
      save(); renderMain(); toast(k? "📥 "+k+" وانە هاوردە کرا ✓" : "هیچ وانەیەک لە فایلەکەدا نەدۆزرایەوە");
    }catch(e){ toast("فایلەکە دروست نییە"); }
  };
  inp.click();
}

let bookURLs={};
async function resolveBook(){
  const sj=curBook(); if(bookURLs[sj.key]) return bookURLs[sj.key];
  const keep=u=>(bookURLs[sj.key]=u);
  try{ const b=await idbGet(sj.idb); if(b&&b.size){ return keep(URL.createObjectURL(b.type?b:new Blob([b],{type:"application/pdf"}))); } }catch(e){}
  if(location.protocol.startsWith("http")){
    try{ const r=await fetch(sj.file,{method:"HEAD",cache:"no-store"}); if(r.ok && /pdf/i.test(r.headers.get("content-type")||"")) return keep(sj.file); }catch(e){}
  }
  try{
    if(driveHandle && (await driveHandle.queryPermission({mode:"read"}))==="granted"){
      const names=sj.key!=="hist"?[BOOKINFO().file,sj.file]:[BOOKINFO().file,sj.file,"HSH-textbook-grade-"+S.stage+".pdf"];

}
function bookOpen(pg){

  const n=parseInt(normDigits(pg),10); const hash=n>0?("#page="+(n+sj.off)):"";
  const w=window.open("","_blank");            // بە خێرایی دەکرێتەوە بۆ ئەوەی وێبگەڕ بلۆکی نەکات

async function openMat(mt){
  if(!mt) return;
  if(mt.kind==="link"){ window.open(mt.url,"_blank"); return; }
  if(mt.kind==="img"){ const w=window.open(); if(w){ w.document.write('<title>'+esc(mt.label||"وێنە")+'</title><img src="'+mt.data+'" style="max-width:100%">'); } return; }
  if(mt.kind==="file"){
    if(!driveHandle){ toast("فۆڵدەری Drive نەبەستراوەتەوە"); return; }
    try{ const fh=await driveHandle.getFileHandle(mt.file); const f=await fh.getFile(); window.open(URL.createObjectURL(f),"_blank"); }
    catch(e){ toast("فایل نەدۆزرایەوە لە فۆڵدەرەکە"); }
  }
}

async function lessonUpload(term,n,file,after){
  if(!driveHandle){ toast("سەرەتا فۆڵدەری Drive ببەستەوە"); return; }
  try{
    if(!(await ensurePerm(driveHandle,true))){ toast("مۆڵەت پێویستە"); return; }
    const ext=(file.name.split(".").pop()||"dat").toLowerCase();
    const sub = /^(mp4|mov|webm|mkv|avi|m4v)$/.test(ext)?"video" : /^(pptx?|key)$/.test(ext)?"ppt" : /^(jpe?g|png|gif|webp)$/.test(ext)?"img" : /^(pdf|docx?|txt)$/.test(ext)?"doc" : "link";
    const name="AMT-g"+S.stage+"-"+term+"-L"+n+"-"+Date.now()+"."+ext;
    const fh=await driveHandle.getFileHandle(name,{create:true});
    const w=await fh.createWritable(); await w.write(file); await w.close();
    LES(term,n).mats.push({id:uid(),kind:"file",sub,label:file.name,file:name});
    save(); (after||(()=>openLesson(n)))(); toast("فایل ئەپلۆد کرا بۆ Drive");
  }catch(e){ toast("ئەپلۆد سەرکەوتوو نەبوو"); }
}

  <div class="mlib">${METHOD_KEYS.map(k=>methodCard(k,true)).join("")}</div>`;

    </div>

    </div>`;
}

function drivePanel(){
  if(!window.showDirectoryPicker){
    return `<div class="panel"><h3>پاشەکەوتی ئۆتۆماتیکی لە Google Drive</h3>
      <p class="hint">بۆ پاشەکەوتی ئۆتۆماتیکی، ئەپەکە بە <b>Chrome</b> یان <b>Edge</b> بکەرەوە (وەک ئەپی سەربەخۆ). لە ئێستادا دەتوانیت پاشەکەوتی دەستی لە خوارەوە بەکاربهێنیت.</p></div>`;
  }
  let body;
  if(driveStatus==="on"){
    body=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="att-toggle" style="background:var(--green-soft);border-color:#bfe0cc;color:var(--green)">✓ بەستراوەتەوە — داتا بەخۆکار پاشەکەوت دەبێت</span>
      <button class="btn btn-gh btn-sm" id="driveConnect">گۆڕینی فۆڵدەر</button>
      <button class="btn btn-gh btn-sm" id="driveDisc">پچڕاندن</button></div>`;
  } else if(driveStatus==="reconnect"||driveStatus==="err"){
    body=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <span class="att-toggle" style="background:var(--amber-soft);border-color:#e9d8b4;color:#7A551A">⚠ پێویستە مۆڵەت نوێ بکەیتەوە</span>
      <button class="btn btn-pri btn-sm" id="driveConnect">دووبارە بەستنەوە</button></div>`;
  } else {
    body=`<button class="btn btn-pri btn-sm" id="driveConnect">🔗 بەستنەوەی فۆڵدەری Drive</button>`;
  }
